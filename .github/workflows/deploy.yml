name: Blog

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 普通 push（比如新增/修改 articles/）时，只处理本地文章，不访问 GitHub
      - name: Sync posts from articles
        if: github.event_name == 'push'
        run: python sync_issues.py --no-issues

      # issue 变化时，把 issues 同步成 Markdown + data.jsonc
      - name: Sync posts from issues
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_issues.py --repo ${{ github.repository }} --prune-unmanaged

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.jsonc posts .issues-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "sync posts from issues/articles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 只把站点需要的文件放进产物，避免把脚本和状态文件暴露到线上
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html data.jsonc _site/
          cp -R posts _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
