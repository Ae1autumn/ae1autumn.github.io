name: Blog

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # posts/ 不进仓库，每次构建都全量重建（issues + articles）。
      # --full 忽略 ETag 缓存，否则全新 checkout 里拿不到 issue 正文。
      # 生成结果只进入 Pages 产物，不回写仓库。
      - name: Build posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_issues.py --repo ${{ github.repository }} --full --prune-unmanaged

      # 只把站点需要的文件放进产物，避免把脚本和状态文件暴露到线上
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html data.jsonc _site/
          cp -R posts _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
