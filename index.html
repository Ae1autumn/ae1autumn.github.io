      updateChapterBlocks();             // 同步悬浮章节指示器
      requestAnimationFrame(function () { updateFade(fsChap1); updateFade(fsChap2); });
    }
    if (openPanel) syncPanelPositions(); // 全屏下面板需重新定位
  }

  /* ── blur 高度 ── */
  function syncBlurHeight() {
    postBlur.style.height = document.getElementById('title-bar').offsetHeight + 'px';
  }

  /* ── 面板坐标：左右面板宽≈容器一半，高随内容 ── */
  const GAP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel-gap')) || 12;
  function syncPanelPositions() {
    const r = postContent.getBoundingClientRect();
    const tr = postToolbarRow.getBoundingClientRect();
    const w = Math.min(Math.max(r.width * 0.5, 190), 340);
    if (isFullscreen) {
      // 工具栏隐藏：TOC 锚定左上角悬浮指示器下方，搜索/评论贴顶部
      const fsTop = 38 + GAP * 2; // 悬浮条 top + 高度 + 间距
      const fsMaxH = Math.max(window.innerHeight - fsTop - GAP, 160);
      panelChapters.style.top = fsTop + 'px';
      panelChapters.style.left = GAP + 'px';
      panelChapters.style.width = w + 'px';
      /* TOC 最大高度与普通模式保持一致 */
      panelChapters.style.maxHeight = (r.height * 0.55) + 'px';
      const cmW = Math.min(r.width - GAP * 2, 640);
      panelComments.style.top = fsTop + 'px';
      panelComments.style.width = cmW + 'px';
      panelComments.style.left = (r.left + (r.width - cmW) / 2) + 'px';
      panelComments.style.right = 'auto';
      panelSearch.style.top = fsTop + 'px';
      panelSearch.style.right = Math.max(window.innerWidth - r.right + GAP, 8) + 'px';
      panelSearch.style.width = w + 'px';
      panelSearch.style.maxHeight = fsMaxH + 'px';
      return;
    }
    panelChapters.style.top = (r.top + GAP) + 'px';
    panelChapters.style.left = Math.max(r.left + GAP, 8) + 'px';
    panelChapters.style.width = w + 'px';
    panelChapters.style.maxHeight = (r.height * 0.55) + 'px';
    const cmW = Math.min(r.width - GAP * 2, 640);
    const cmTop = tr.bottom + GAP;
    panelComments.style.top = cmTop + 'px';
    panelComments.style.width = cmW + 'px';
    panelComments.style.left = (r.left + (r.width - cmW) / 2) + 'px';
    panelComments.style.right = 'auto';
    panelSearch.style.top = (r.top + GAP) + 'px';
    panelSearch.style.right = Math.max(window.innerWidth - r.right + GAP, 8) + 'px';
    panelSearch.style.width = w + 'px';
    panelSearch.style.maxHeight = (r.height * 0.55) + 'px';
  }

  /* ── 滚动劫持（面板打开时锁正文滚动） ── */
  const HIJACK = ['scroll', 'wheel', 'touchmove'];
  function hijackHandler(e) {
    if (e.type === 'scroll' && e.target === postContent) return;
    const el = { chapters: panelChapters, comments: panelComments, search: panelSearch }[openPanel];
    if (el && el.contains(e.target)) return;
    e.stopPropagation(); e.preventDefault();
  }
  function startHijack() {
    HIJACK.forEach(function (t) { document.addEventListener(t, hijackHandler, { capture: true, passive: false }); });
  }
  function stopHijack() {
    HIJACK.forEach(function (t) { document.removeEventListener(t, hijackHandler, { capture: true }); });
  }

  /* ── 面板开关 ── */
  const PANEL_EL = { chapters: panelChapters, comments: panelComments, search: panelSearch };
  const PANEL_BTN = { comments: btnComments, search: btnSearchPost };
  const closeTimers = {};
  let pendingOpen = null;

  function _doOpen(name) {
    clearTimeout(closeTimers[name]); delete closeTimers[name];
    if (pendingOpen) { clearTimeout(pendingOpen); pendingOpen = null; }
    const el = PANEL_EL[name];
    syncPanelPositions();
    el.classList.add('is-ready', 'is-open');
    if (PANEL_BTN[name]) PANEL_BTN[name].classList.add('is-active');
    panelOverlay.classList.add('is-active');
    openPanel = name;
    startHijack();
    if (name === 'chapters') {
      buildToc();
      requestAnimationFrame(function () { syncTocActive(true); updateVFade(tocBody); refreshTocFades(); });
    }
    if (name === 'search') { setTimeout(function () { searchInput.focus(); }, 200); }
    if (name === 'comments') mountGiscus();
    requestAnimationFrame(refreshVFades);
  }
  function _doClose(name) {
    const el = PANEL_EL[name];
    clearTimeout(closeTimers[name]);
    el.classList.remove('is-open');
    if (PANEL_BTN[name]) PANEL_BTN[name].classList.remove('is-active');
    panelOverlay.classList.remove('is-active');
    openPanel = null;
    stopHijack();
    closeTimers[name] = setTimeout(function () {
      delete closeTimers[name]; el.classList.remove('is-ready');
    }, 460);
    if (name === 'search') clearSearch();
  }
  function closeAllPanels() {
    if (pendingOpen) { clearTimeout(pendingOpen); pendingOpen = null; }
    if (openPanel) _doClose(openPanel);
  }
  function togglePanel(name) {
    if (openPanel === name) { _doClose(name); return; }
    if (openPanel) {
      _doClose(openPanel);
      pendingOpen = setTimeout(function () { pendingOpen = null; _doOpen(name); }, 460);
      return;
    }
    _doOpen(name);
  }
  panelOverlay.addEventListener('click', closeAllPanels);
  document.querySelectorAll('[data-close-panel]').forEach(function (b) {
    b.addEventListener('click', closeAllPanels);
  });
  $('toc-top').addEventListener('click', function () {
    postContent.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('toc-bottom').addEventListener('click', function () {
    postContent.scrollTo({ top: postContent.scrollHeight, behavior: 'smooth' });
  });

  /* ── localStorage ── */
  function loadState(slug) {
    try {
      const s = JSON.parse(localStorage.getItem('post_state_' + slug) || 'null');
      if (!s || !Number.isFinite(s.usedSeconds) || !Number.isFinite(s.scrollTop) || typeof s.hasReachedEnd !== 'boolean') return null;
      return s;
    } catch (e) { return null; }
  }
  function saveState(slug) {
    if (!slug || !contentReady) return;
    try {
      localStorage.setItem('post_state_' + slug, JSON.stringify({
        scrollTop: postContent.scrollTop,
        usedSeconds: usedSeconds,
        hasReachedEnd: isFullyRead(),
      }));
    } catch (e) {}
  }
  function clearState(slug) { try { localStorage.removeItem('post_state_' + slug); } catch (e) {} }

  /* ── 计时 ── */
  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(function () {
      usedSeconds++;
      renderTimer();
      if (usedSeconds % 5 === 0) saveState(currentSlug);
    }, 1000);
  }
  function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
  function setUsed(t) { postUsed.textContent = t; fsUsed.textContent = t; }
  function renderTimer() { setUsed(String(Math.floor(usedSeconds / 60)).padStart(2, '0')); }
  function estimateReadMin(text) {
    const speed = typeof window.getReadSpeed === 'function' ? window.getReadSpeed() : 300;
    const zh = (text.match(/[一-龥]/g) || []).length;
    const en = text.replace(/[一-龥]/g, '').trim().split(/\s+/).filter(Boolean).length;
    /* 英文按中文速度的 53% 折算 */
    return Math.ceil(zh / speed + en / (speed * 0.53)) || 0;
  }
  window.addEventListener('readspeedchange', function () {
    if (!currentSlug || !rawMarkdown || loadFailed) return;
    postRead.textContent = String(estimateReadMin(rawMarkdown)).padStart(2, '0');
  });
  function setTimerError() {
    /* 顶部计时器整个移除；全屏计时器保留位置，显示占位文本 */
    postTimer.style.display = 'none';
    fsTimer.style.display = '';
    fsTimer.classList.add('is-error');
    eyeOpen.style.display = 'none'; eyeClosed.style.display = '';
    clockHand.setAttribute('points', '12 6 12 12 12 12');
    setUsed('-'); postRead.textContent = '-';
    fsUsed.textContent = 'NaN';
  }
  function resetTimerNormal() {
    postTimer.style.display = '';
    fsTimer.style.display = '';
    fsTimer.classList.remove('is-error');
    eyeOpen.style.display = ''; eyeClosed.style.display = 'none';
    clockHand.setAttribute('points', '12 6 12 12 16 14');
  }

  /* ── 进度 ── */
  function updateProgress() {
    const max = postContent.scrollHeight - postContent.clientHeight;
    const pct = max > 0 ? (postContent.scrollTop / max) * 100 : 0;
    postHeaderRow.style.setProperty('--post-progress', pct.toFixed(2) + '%');
    fsChap.style.setProperty('--fs-progress', pct.toFixed(2) + '%');
  }
  function isFullyRead() {
    const max = postContent.scrollHeight - postContent.clientHeight;
    return max <= 0 || postContent.scrollTop >= max - 8;
  }

  function restoreScrollPosition(savedTop, token, onDone) {
    const imgs = Array.prototype.slice.call(postContent.querySelectorAll('img'));
    let applied = false, userMoved = false;
    function mark() { userMoved = true; }
    function apply() {
      if (applied) return;
      applied = true;
      postContent.removeEventListener('scroll', mark);
      if (token !== postLoadToken) return;
      contentReady = true;
      if (!userMoved) {
        postContent.scrollTop = savedTop || 0;
        updateProgress(); updateChapterBlocks();
      }
      if (onDone) onDone();
    }
    if (!imgs.length) { requestAnimationFrame(apply); return; }
    postContent.addEventListener('scroll', mark, { passive: true });
    let remaining = imgs.length;
    function settle() { if (--remaining <= 0) requestAnimationFrame(apply); }
    imgs.forEach(function (img) {
      if (img.complete) { settle(); return; }
      img.addEventListener('load', settle, { once: true });
      img.addEventListener('error', settle, { once: true });
    });
    setTimeout(apply, 1500);
  }

  /* ── 标题分享 / 目录索引 ── */
  /* 标题分享链接：?h=<id> 放在 hash 路由之前，避免被当成 slug 的一部分 */
  function headingShareUrl(id) {
    if (!currentSlug) return window.location.href;
    try {
      var u = new URL(window.location.href);
      u.hash = '';
      u.searchParams.set('h', id);
      return u.href + '#/post/' + currentSlug;
    } catch (e) {
      return window.location.href.split('#')[0].split('?')[0] +
        '?h=' + encodeURIComponent(id) + '#/post/' + currentSlug;
    }
  }

  /* 读取并清除 ?h= 深链（只消费一次），返回目标 id */
  function takeHeadingDeepLink() {
    try {
      var u = new URL(window.location.href);
      var id = u.searchParams.get('h');
      if (!id) return '';
      u.searchParams.delete('h');
      try { history.replaceState(null, '', u.href); } catch (e) {}
      return id;
    } catch (e) {
      return '';
    }
  }

  function scrollToHeading(id, smooth) {
    var target = document.getElementById(id);
    if (!target || !postContent.contains(target)) return false;
    var top = target.getBoundingClientRect().top - postContent.getBoundingClientRect().top + postContent.scrollTop - 14;
    if (smooth) postContent.scrollTo({ top: top, behavior: 'smooth' });
    else postContent.scrollTop = top;
    updateProgress(); updateChapterBlocks(); updateVFade(postContent);
    return true;
  }

  /* ── 章节指示器 / 目录 ── */
  function buildHeadings() {
    const all = Array.prototype.slice.call(postContent.querySelectorAll('h1,h2,h3,h4,h5,h6'))
      .filter(function (el) { return !el.classList.contains('sr-only'); }); // 排除脚注区块的无障碍标签
    /* 统一锚点：裸 <h1>~<h6> 走 html token，不经 renderer.heading，没有 id。
       清空后按文档顺序重算，裸标题才吃得到正文的 #锚点，且首个同名标题拿无后缀 id */
    if (typeof window.slugifyHeading === 'function' && window.resetHeadingSlugs) {
      all.forEach(function (el) { el.removeAttribute('id'); });
      window.resetHeadingSlugs();
      all.forEach(function (el) {
        var base = window.slugifyHeading(el.textContent || '');
        var id = base, n = 1;
        while (document.getElementById(id)) id = base + '-' + (n++);
        el.id = id;
      });
    }

    /* 目录起始规则：
       1. 跳过第一个 H1（通常是文章主标题）
       2. 在剩余标题里按 H1→H6 找到第一个存在的层级
       3. 从该层级的第一个标题开始进目录；都没有则目录为空 */
    const skipped = all.findIndex(function (el) { return el.tagName === 'H1'; });
    const rest = skipped >= 0
      ? all.filter(function (el, i) { return i !== skipped; })
      : all.slice();
    let baseLevel = 0;
    for (let lv = 1; lv <= 6; lv++) {
      if (rest.some(function (el) { return parseInt(el.tagName[1], 10) === lv; })) {
        baseLevel = lv;
        break;
      }
    }
    let tocFrom = -1;
    if (baseLevel) {
      tocFrom = rest.findIndex(function (el) { return parseInt(el.tagName[1], 10) === baseLevel; });
    }
    headings = (tocFrom >= 0 ? rest.slice(tocFrom) : []).map(function (el) {
      return { el: el, level: parseInt(el.tagName[1], 10), text: el.textContent.trim() };
    });

    setChapterEmpty(!headings.length);
    /* 目录在文章加载期间就被打开时，标题建好后补渲染一次 */
    if (openPanel === 'chapters') {
      buildToc();
      syncTocActive(true);
    }
  }
  function getCurrentHeadings() {
    const containerTop = postContent.getBoundingClientRect().top;
    /* 识别线随阅读进度下移：进度 0 时距顶 60px，进度 100% 时贴到容器底部，
       保证贴近底部的章节也能被识别 */
    const max = postContent.scrollHeight - postContent.clientHeight;
    const prog = max > 0 ? Math.min(Math.max(postContent.scrollTop / max, 0), 1) : 1;
    const threshold = 60 + (postContent.clientHeight - 60) * prog;
    let idx = -1;
    for (let i = 0; i < headings.length; i++) {
      if (headings[i].el.getBoundingClientRect().top - containerTop <= threshold) idx = i;
      else break;
    }
    if (idx < 0) return { parent: '', child: '', idx: -1 };
    const active = headings[idx];
    let parent = null;
    for (let i = idx - 1; i >= 0; i--) {
      if (headings[i].level < active.level) { parent = headings[i]; break; }
    }
    return parent
      ? { parent: parent.text, child: active.text, idx: idx }
      : { parent: active.text, child: '', idx: idx };
  }
  /* 当前判定线往上的最近章节 id：复用目录高亮那条线，
     保证「复制的链接」和「高亮的章节」永远是同一节；线在最上方时返回空，调用方回退文章链接 */
  function currentSectionId() {
    const idx = getCurrentHeadings().idx;
    return idx >= 0 && headings[idx] && headings[idx].el.id ? headings[idx].el.id : '';
  }
  /* 截断边缘渐隐：按可滚动余量双向切换。
     折叠动画中途 clientWidth≈0，此时一律清除渐隐，
     避免切换标题瞬间出现瞬时阴影 */
  function updateFade(el) {
    if (el.classList.contains('collapsed') || el.clientWidth < 2) {
      el.classList.remove('fade-l', 'fade-r');
      return;
    }
    const over = el.scrollWidth > el.clientWidth + 1;
    el.classList.toggle('fade-l', over && el.scrollLeft > 1);
    el.classList.toggle('fade-r', over && el.scrollLeft < el.scrollWidth - el.clientWidth - 1);
  }
  /* 目录项横向截断的左右渐隐：面板重建 / 打开 / 视口变化时重算 */
  function refreshTocFades() {
    if (!tocList) return;
    tocList.querySelectorAll('.toc-scroll').forEach(updateFade);
  }
  tocList.addEventListener('scroll', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('toc-scroll')) updateFade(e.target);
  }, { capture: true, passive: true });
  /* 纵向版：正文 / 目录 / 搜索结果的上下边缘渐隐 */
  const tocBody = panelChapters.querySelector('.panel-body');
  const srBody  = panelSearch.querySelector('.panel-body');
  function updateVFade(el) {
    if (!el || el.clientHeight < 2) { if (el) el.classList.remove('fade-t', 'fade-b'); return; }
    const over = el.scrollHeight > el.clientHeight + 1;
    el.classList.toggle('fade-t', over && el.scrollTop > 1);
    el.classList.toggle('fade-b', over && el.scrollTop < el.scrollHeight - el.clientHeight - 1);
  }
  function refreshVFades() {
    updateVFade(postContent); updateVFade(tocBody); updateVFade(srBody);
  }
  /* 代码块展开/收起会改变正文高度：同步进度、章节指示与上下渐隐 */
  window.refreshPostLayout = function () {
    updateProgress(); updateChapterBlocks(); refreshVFades();
  };
  [tocBody, srBody].forEach(function (el) {
    if (el) el.addEventListener('scroll', function () { updateVFade(el); }, { passive: true });
  });
  [chap1, chap2].forEach(function (el) {
    el.addEventListener('scroll', function () { updateFade(el); }, { passive: true });
  });
  [fsChap1, fsChap2].forEach(function (el) {
    el.addEventListener('scroll', function () { updateFade(el); }, { passive: true });
  });

  /* 章节切换：文本变化时自下而上滚入 */
  function rollText(block, t) {
    const el = block.querySelector('.chap-text');
    if (el.textContent === t) return;
    el.textContent = t;
    el.classList.remove('chap-in');
    void el.offsetWidth; // 重启动画
    el.classList.add('chap-in');
  }

  function syncChapterIndicator(parts, current) {
    const has = !!current.parent;
    parts.hint.classList.toggle('collapsed', has);
    parts.first.classList.toggle('collapsed', !has);
    rollText(parts.first, current.parent);
    parts.first.scrollLeft = 0;
    parts.sep.classList.toggle('collapsed', !current.child);
    parts.second.classList.toggle('collapsed', !current.child);
    rollText(parts.second, current.child);
    parts.second.scrollLeft = 0;
    parts.first.classList.remove('fade-l', 'fade-r');
    parts.second.classList.remove('fade-l', 'fade-r');
    setTimeout(function () {
      updateFade(parts.first);
      updateFade(parts.second);
    }, 380);
  }

  function resetChapterIndicator(parts) {
    parts.hint.classList.remove('collapsed');
    parts.first.classList.add('collapsed');
    parts.sep.classList.add('collapsed');
    parts.second.classList.add('collapsed');
    parts.first.classList.remove('fade-l', 'fade-r');
    parts.second.classList.remove('fade-l', 'fade-r');
  }

  function updateChapterBlocks() {
    const c = getCurrentHeadings();
    if (c.parent === currentChap1 && c.child === currentChap2) {
      syncTocActive();
      return;
    }
    currentChap1 = c.parent;
    currentChap2 = c.child;
    syncChapterIndicator({ hint: chapHint, first: chap1, sep: chapSep, second: chap2 }, c);
    syncChapterIndicator({ hint: fsChapHint, first: fsChap1, sep: fsChapSep, second: fsChap2 }, c);
    syncTocActive();
  }

  function setChapterEmpty(isEmpty) {
    chapWrap.classList.toggle('is-empty', isEmpty);
    fsChap.classList.toggle('is-empty', isEmpty);
    /* 全屏悬浮条没有章节时显示 No Chapters，保持可见、可点击 */
    fsChapHint.textContent = isEmpty ? 'No Chapters' : '目录';
  }

  function resetChapterBlocks() {
    headings = [];
    tocItems = [];
    activeTocIdx = -1;
    currentChap1 = '';
    currentChap2 = '';
    setChapterEmpty(true);
    resetChapterIndicator({ hint: chapHint, first: chap1, sep: chapSep, second: chap2 });
    resetChapterIndicator({ hint: fsChapHint, first: fsChap1, sep: fsChapSep, second: fsChap2 });
  }

  /* ── 目录面板 ── */
  function buildToc() {
    tocList.innerHTML = '';
    tocItems = [];
    activeTocIdx = -1;
    if (!headings.length) {
      tocList.innerHTML = '<p class="toc-empty">本文也许没有章节</p>';
      return;
    }
    // 仅根据真实祖先关系生成层级；没有父级的标题不画竖线
    let no = 0;
    const ancestors = [];
    headings.forEach(function (h) {
      while (ancestors.length && ancestors[ancestors.length - 1].level >= h.level) ancestors.pop();
      const level = Math.min(ancestors.length + 1, 6);
      const item = document.createElement('button');
      item.className = 'toc-item lv-' + level;
      item.type = 'button';
      if (h.level === 1) {
        no++;
        const noEl = document.createElement('span');
        noEl.className = 'toc-no';
        noEl.textContent = String(no).padStart(2, '0');
        item.appendChild(noEl);
      }
      const scroll = document.createElement('span');
      scroll.className = 'toc-scroll';
      const text = document.createElement('span');
      text.className = 'toc-text';
      text.textContent = h.text;
      scroll.appendChild(text);
      item.appendChild(scroll);
      item.addEventListener('click', function () {
        const top = h.el.getBoundingClientRect().top - postContent.getBoundingClientRect().top + postContent.scrollTop - 14;
        postContent.scrollTo({ top: top, behavior: 'smooth' });
        setTimeout(closeAllPanels, 250);
      });
      tocList.appendChild(item);
      tocItems.push(item);
      ancestors.push(h);
    });
    requestAnimationFrame(refreshTocFades);
  }
  function syncTocActive(force) {
    if (openPanel !== 'chapters' || !tocItems.length) return;
    const idx = getCurrentHeadings().idx;
    if (!force && idx === activeTocIdx) return;
    activeTocIdx = idx;
    tocItems.forEach(function (el, i) { el.classList.toggle('is-active', i === idx); });
    if (idx >= 0 && tocItems[idx]) {
      const it = tocItems[idx];
      const body = tocList.parentElement;
      const itemTop = it.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
      const outside = itemTop < body.scrollTop || itemTop + it.offsetHeight > body.scrollTop + body.clientHeight;
      if (force || outside) {
        body.scrollTo({
          top: itemTop - body.clientHeight / 2 + it.offsetHeight / 2,
          behavior: 'smooth'
        });
      }
    }
  }

  /* ── 文内搜索 ── */
  let hits = [], hitIdx = -1;
  let hitCtx = []; // [{context, start, end}]
  let srItems = [];
  let searchTimer = null;
  const srResults = $('sr-results');
  const BOUNDARY = /[，。！？；：、,.!?;:"'“”‘’（）()《》〈〉「」『』\s]/;
  const mobileSearchMQ = window.matchMedia('(hover: none), (pointer: coarse)');

  function clearSearch() {
    clearTimeout(searchTimer);
    searchTimer = null;
    const marks = postContent.querySelectorAll('mark.s-hit');
    marks.forEach(function (m) {
      const parent = m.parentNode;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
    hits = []; hitIdx = -1; hitCtx = []; srItems = [];
    srResults.innerHTML = '';
    searchCount.textContent = '';
    searchPrev.disabled = true; searchNext.disabled = true;
    updateVFade(srBody); // 清空结果后同步渐隐
  }

  /* 截取命中词前后最近标点/空白/换行之间的片段 */
  function sliceContext(text, start, end) {
    let s = start;
    while (s > 0 && !BOUNDARY.test(text[s - 1])) s--;
    let e = end;
    while (e < text.length && !BOUNDARY.test(text[e])) e++;
    return { context: text.slice(s, e), start: start - s, end: end - s };
  }

  function runSearch(q) {
    clearSearch();
    q = q.trim();
    if (!q) return;
    const needle = q.toLowerCase();
    const walker = document.createTreeWalker(postContent, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = node.parentNode;
        if (!p || /^(SCRIPT|STYLE|MARK)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.toLowerCase().indexOf(needle) !== -1
          ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      const frag = document.createDocumentFragment();
      let pos = 0, i;
      while ((i = lower.indexOf(needle, pos)) !== -1) {
        hitCtx.push(sliceContext(text, i, i + needle.length));
        if (i > pos) frag.appendChild(document.createTextNode(text.slice(pos, i)));
        const mark = document.createElement('mark');
        mark.className = 's-hit';
        mark.textContent = text.slice(i, i + needle.length);
        frag.appendChild(mark);
        pos = i + needle.length;
      }
      frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
    hits = Array.prototype.slice.call(postContent.querySelectorAll('mark.s-hit'));
    buildResults();
    const has = hits.length > 0;
    searchPrev.disabled = !has; searchNext.disabled = !has;
    if (has) {
      if (mobileSearchMQ.matches) {
        hitIdx = -1;
        searchCount.textContent = hits.length + ' 处匹配';
      } else {
        jumpToHit(0);
      }
    } else searchCount.textContent = '无匹配';
  }

  /* 结果列表：命中词居中，溢出截断并加边缘渐隐 */
  function buildResults() {
    srResults.innerHTML = '';
    srItems = [];
    hitCtx.forEach(function (hc, idx) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'sr-item';
      const scroll = document.createElement('span');
      scroll.className = 'sr-scroll';
      scroll.appendChild(document.createTextNode(hc.context.slice(0, hc.start)));
      const b = document.createElement('b');
      b.textContent = hc.context.slice(hc.start, hc.end);
      scroll.appendChild(b);
      scroll.appendChild(document.createTextNode(hc.context.slice(hc.end)));
      item.appendChild(scroll);
      item.addEventListener('click', function () { jumpToHit(idx); });
      srResults.appendChild(item);
      srItems.push(item);
    });
    // 渲染后居中命中词并初始化渐隐
    requestAnimationFrame(function () {
      srItems.forEach(function (item) {
        const scroll = item.querySelector('.sr-scroll');
        const b = scroll.querySelector('b');
        /* 用视口坐标差计算，避免 offsetLeft 受 positioned 祖先影响而偏离中心 */
        const delta = b.getBoundingClientRect().left - scroll.getBoundingClientRect().left;
        scroll.scrollLeft += delta - (scroll.clientWidth - b.getBoundingClientRect().width) / 2;
        updateFade(scroll);
      });
      updateVFade(srBody); // 结果列表高度变化后刷新纵向渐隐
    });
  }

  srResults.addEventListener('scroll', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('sr-scroll')) updateFade(e.target);
  }, { capture: true, passive: true });

  function jumpToHit(i) {
    if (!hits.length) return;
    hitIdx = ((i % hits.length) + hits.length) % hits.length;
    hits.forEach(function (m, j) { m.classList.toggle('is-current', j === hitIdx); });
    srItems.forEach(function (it, j) { it.classList.toggle('is-active', j === hitIdx); });
    const el = hits[hitIdx];
    const top = el.getBoundingClientRect().top - postContent.getBoundingClientRect().top + postContent.scrollTop - postContent.clientHeight / 2;
    postContent.scrollTo({ top: top, behavior: 'smooth' });
    const it = srItems[hitIdx];
    if (it) {
      const body = srResults.parentElement;
      const itemTop = it.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
      if (itemTop < body.scrollTop || itemTop + it.offsetHeight > body.scrollTop + body.clientHeight) {
        body.scrollTo({
          top: itemTop - body.clientHeight / 2 + it.offsetHeight / 2,
          behavior: 'smooth'
        });
      }
    }
    searchCount.textContent = (hitIdx + 1) + ' / ' + hits.length;
  }

  function stepHit(delta) {
    if (!hits.length) return;
    if (hitIdx < 0) jumpToHit(delta < 0 ? hits.length - 1 : 0);
    else jumpToHit(hitIdx + delta);
  }

  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { runSearch(searchInput.value); }, 140);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      /* 重新打开面板时高亮已被清空但关键词还在：此时 Enter 应重新执行搜索 */
      if (!hits.length && searchInput.value.trim()) runSearch(searchInput.value);
      else stepHit(e.shiftKey ? -1 : 1);
    }
    if (e.key === 'Escape') { e.stopPropagation(); closeAllPanels(); btnSearchPost.focus(); }
  });
  searchPrev.addEventListener('click', function () { stepHit(-1); });
  searchNext.addEventListener('click', function () { stepHit(1); });

  let copyLock = false;
  function openCopyModal() {
    copyModal.classList.add('is-open');
    copyModal.setAttribute('aria-hidden', 'false');
    const first = copyOptions.querySelector('[data-copy]');
    if (first) first.focus({ preventScroll: true });
  }
  function closeCopyModal(restoreFocus) {
    copyModal.classList.remove('is-open');
    copyModal.setAttribute('aria-hidden', 'true');
    if (restoreFocus !== false && currentSlug) btnCopy.focus({ preventScroll: true });
  }
  copyModal.addEventListener('click', function (e) { if (e.target === copyModal) closeCopyModal(); });

  function copyText(str, done) {
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(str).then(function () { done(true); }, fallback);
    } else fallback();
  }
  window.copyText = copyText;

  const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
  copyOptions.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-copy]');
    if (!btn || copyLock) return;
    const kind = btn.dataset.copy;
    let text = '';
    if (kind === 'markdown') text = rawMarkdown;
    else if (kind === 'text') {
      /* 折叠头栏是交互控件，不算正文；临时隐藏后再取纯文本 */
      const heads = postContent.querySelectorAll('.code-head');
      Array.prototype.forEach.call(heads, function (el) { el.style.display = 'none'; });
      try { text = postContent.innerText; }
      finally {
        Array.prototype.forEach.call(heads, function (el) { el.style.display = ''; });
      }
    }
    else if (kind === 'link') {
      /* 优先复制当前章节的深链；还没到第一个标题时退回文章链接 */
      const hid = currentSectionId();
      text = hid
        ? headingShareUrl(hid)
        : window.location.origin + window.location.pathname + '#/post/' + currentSlug;
    }
    copyText(text, function (ok) {
      if (!ok) return;
      const others = Array.prototype.filter.call(
        copyOptions.querySelectorAll('[data-copy]'),
        function (b) { return b !== btn; }
      );
      const savedHTML = btn.innerHTML;
      copyLock = true;
      btn.classList.add('is-copied');
      btn.innerHTML = CHECK_SVG;
      others.forEach(function (b) { b.classList.add('is-disabled'); });
      setTimeout(function () {
        copyLock = false;
        btn.classList.remove('is-copied');
        btn.innerHTML = savedHTML;
        others.forEach(function (b) { b.classList.remove('is-disabled'); });
        closeCopyModal();
      }, 2000);
    });
  });

  async function openPost(slug, meta) {
    const token = ++postLoadToken;
    clearTimeout(closePostTimer);

    /* 阅读量：首次打开某篇时发送虚拟 pageview；重载/重试不重复计数 */
    if (currentSlug !== slug && window.trackPostView) window.trackPostView(slug, meta && meta.title);

    const wasLoading = postHeaderRow.classList.contains('is-loading');
    if (currentSlug && currentSlug !== slug && !loadFailed && !wasLoading) {
      if (isFullyRead()) clearState(currentSlug); else saveState(currentSlug);
    }
    pauseTimer();

    contentReady = false; usedSeconds = 0; loadFailed = false; rawMarkdown = '';
    if (currentAbort) { currentAbort.abort(); currentAbort = null; }
    resetChapterBlocks();
    setPostControlsDisabled(false);
    postContent.classList.remove('is-empty');
    clearSearch();
    searchInput.value = '';

    currentSlug = slug; currentMeta = meta;
    closeAllPanels();
    syncBlurHeight();
    postHeaderTitle.innerHTML = window.formatTitle(window.postValue(meta.title, 'Untitled'));

    postPage.classList.add('is-open');
    postPage.setAttribute('aria-hidden', 'false');
    postPage.inert = false;
    if (!postScrollLocked) {
      window.lockBackgroundScroll();
      postScrollLocked = true;
    }

    postContent.innerHTML = '';
    postContent.scrollTop = 0;
    postHeaderRow.style.setProperty('--post-progress', '0%');
    postHeaderRow.classList.add('is-loading');
    resetTimerNormal();
    setUsed('00'); postRead.textContent = '-';

    /* 加载进度：有 Content-Length 按字节进度，否则按已收字节渐近 90% */
    function setLoadProgress(pct) {
      if (token !== postLoadToken) return;
      postHeaderRow.style.setProperty('--post-progress', Math.min(pct, 100).toFixed(1) + '%');
    }

    const aborter = new AbortController();
    currentAbort = aborter;
    try {
      const resp = await fetch(meta.src, { signal: aborter.signal });
      if (!resp.ok) throw new Error('fetch failed');
      const total = parseInt(resp.headers.get('content-length') || '0', 10);
      if (resp.body && resp.body.getReader) {
        const reader = resp.body.getReader();
        const chunks = [];
        let loaded = 0;
        for (;;) {
          const r = await reader.read();
          if (r.done) break;
          chunks.push(r.value);
          loaded += r.value.byteLength;
          setLoadProgress(total ? (loaded / total) * 100 : 100 * (1 - 1 / (1 + loaded / 8192)));
        }
        const buf = new Uint8Array(loaded);
        let off = 0;
        chunks.forEach(function (c) { buf.set(c, off); off += c.byteLength; });
        rawMarkdown = new TextDecoder('utf-8').decode(buf);
      } else {
        rawMarkdown = await resp.text();
      }
      setLoadProgress(100);
    } catch (err) {
      if (token !== postLoadToken || (err || {}).name === 'AbortError') return;
      loadFailed = true;
    }
    if (token !== postLoadToken) return;
    currentAbort = null;

    if (!loadFailed && (typeof marked === 'undefined' || !marked.parse)) loadFailed = true;

    if (loadFailed) {
      resetChapterBlocks();
      postHeaderRow.classList.remove('is-loading');
      postHeaderRow.style.setProperty('--post-progress', '0%');
      setTimerError();
      postContent.innerHTML =
        '<div class="post-reload-wrap">' +
          '<p class="post-reload-hint">这篇文章暂时无法出现在你的视野</p>' +
          '<button class="post-reload-btn" id="post-reload-btn">Reload</button>' +
        '</div>';
      document.getElementById('post-reload-btn').addEventListener('click', function () { openPost(slug, meta); });
      refreshVFades(); // 失败页内容短，清除上一篇残留的渐隐
      return;
    }

    /* 空内容：不渲染 Markdown，只显示提示并禁用无关控件 */
    if (!rawMarkdown.trim()) {
      if (isFullscreen) setFullscreen(false);
      resetChapterBlocks();
      postHeaderRow.classList.remove('is-loading');
      postHeaderRow.style.setProperty('--post-progress', '0%');
      fsChap.style.setProperty('--fs-progress', '0%');
      setTimerError();
      postContent.classList.add('is-empty');
      postContent.innerHTML = '<p class="post-empty" role="status">很遗憾它似乎没有内容</p>';
      setPostControlsDisabled(true);
      refreshVFades();
      contentReady = true;
      return;
    }

    postHeaderRow.classList.remove('is-loading');
    postContent.innerHTML = '<div class="post-content-inner">' + marked.parse(rawMarkdown) + '</div>';
    /* 原生表格套滚动容器、缩写定义落到正文（需在 buildHeadings / 渐隐初始化之前） */
    if (window.decoratePostContent) window.decoratePostContent(postContent);
    postRead.textContent = String(estimateReadMin(rawMarkdown)).padStart(2, '0');
    buildHeadings();
    /* 表格边缘渐隐初始态（内容已插入，此时可测得真实滚动余量） */
    postContent.querySelectorAll('.table-wrap').forEach(updateFade);
    refreshVFades();
    updateChapterBlocks();
    updateProgress();

    const saved = loadState(slug);
    const deepId = takeHeadingDeepLink();
    if (deepId && document.getElementById(deepId)) {
      /* 分享链接 ?h=id：优先回到指定标题，忽略上次的滚动位置。
         先立刻定位一次，图片加载完后再校正一次，避免等图期间停在顶部 */
      scrollToHeading(deepId, false);
      startTimer();
      restoreScrollPosition(postContent.scrollTop, token, function () {
        scrollToHeading(deepId, false);
      });
    } else if (saved && !saved.hasReachedEnd) {
      usedSeconds = saved.usedSeconds;
      renderTimer();
      restoreScrollPosition(saved.scrollTop, token, startTimer);
    } else {
      contentReady = true;
      startTimer();
    }
  }

  function closePost() {
    if (!currentSlug) return;
    postLoadToken++;
    if (currentAbort) { currentAbort.abort(); currentAbort = null; }
    closeAllPanels();
    closeCopyModal(false);
    setFullscreen(false);
    const isLoading = postHeaderRow.classList.contains('is-loading');
    if (!loadFailed && !isLoading && contentReady) {
      if (isFullyRead()) clearState(currentSlug); else saveState(currentSlug);
    }
    pauseTimer();
    postPage.classList.remove('is-open');
    postPage.setAttribute('aria-hidden', 'true');
    closePostTimer = setTimeout(function finalizePostClose() {
      if (postPage.classList.contains('is-open')) return;
      postPage.inert = true;
      if (postScrollLocked) {
        window.unlockBackgroundScroll();
        postScrollLocked = false;
      }
    }, 650);
    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
    currentSlug = null;
    contentReady = false;
  }

  document.addEventListener('visibilitychange', function () {
    if (!currentSlug || loadFailed || isEmptyPost) return;
    const isLoading = postHeaderRow.classList.contains('is-loading');
    if (document.visibilityState === 'hidden') {
      pauseTimer();
      if (!isLoading) saveState(currentSlug);
    } else if (!isLoading && contentReady) {
      startTimer();
    }
  });

  postContent.addEventListener('scroll', function () {
    updateProgress(); updateChapterBlocks(); updateVFade(postContent);
  }, { passive: true });

  /* 图片懒加载完成后内容高度变化，重新计算渐隐（load 不冒泡，用 capture） */
  postContent.addEventListener('load', function (e) {
    if (e.target && e.target.tagName === 'IMG') updateVFade(postContent);
  }, true);

  /* 文内锚点（脚注引用/回链、手写 #锚点）：只滚动，不动 location.hash，否则会触发路由关闭文章 */
  postContent.addEventListener('click', function (e) {
    const a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || !postContent.contains(a)) return;
    const raw = a.getAttribute('href').slice(1);
    if (!raw) return;
    if (raw.charAt(0) === '/') return; // #/post/slug 留给 hash 路由
    /* marked 会把非 ASCII 锚点做百分号编码（#%E4%B8%89-...），先解码才对得上 id */
    let id = raw;
    try { id = decodeURIComponent(raw); } catch (err) {}
    const target = document.getElementById(id);
    /* 无条件拦下默认跳转：目标不存在时若放行，浏览器会改 hash，路由误判为关闭文章 */
    e.preventDefault();
    if (!target || !postContent.contains(target)) return;
    const delta = target.getBoundingClientRect().top - postContent.getBoundingClientRect().top;
    postContent.scrollTop += delta - 20;
  });

  /* 表格横向滚动：滚动时更新边缘渐隐（capture 才能捕获容器自身的 scroll） */
  postContent.addEventListener('scroll', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('table-wrap')) updateFade(e.target);
  }, { capture: true, passive: true });

  postBlur.addEventListener('click', function () {
    if (openPanel) { closeAllPanels(); return; }
    closePost();
  });

  /* 加载失败时：所有按钮点击都转为重载（防卡死、方便探索） */
  function reloadPost() { if (currentSlug && currentMeta) openPost(currentSlug, currentMeta); }
  function guardFailed() { if (!loadFailed) return false; reloadPost(); return true; }

  /* 空文章：顶部关闭区域和评论按钮之外，其余控件统一禁用 */
  const disabledControls = [chapWrap, btnFullscreen, btnCopy, btnSearchPost, fsChap];
  function setPostControlsDisabled(disabled) {
    isEmptyPost = disabled;
    postPage.classList.toggle('is-empty-post', disabled);
    disabledControls.forEach(function (el) {
      el.disabled = disabled;
      if (disabled) el.setAttribute('aria-disabled', 'true');
      else el.removeAttribute('aria-disabled');
    });
  }

  btnCopy.addEventListener('click', function () {
    if (guardFailed() || !rawMarkdown) return;
    openCopyModal();
  });
  btnComments.addEventListener('click', function () {
    if (guardFailed()) return;
    togglePanel('comments');
  });

  /* ── 评论（giscus）：首次打开时挂载；无 key / 失败回退占位 ── */
  const giscusHost       = $('giscus-host');
  const commentsFallback = $('comments-fallback');
  const cmBody           = $('cm-body');
  const GISCUS_ORIGIN    = 'https://giscus.app';
  let giscusMounted = false;
  let giscusFailed  = false;
  let giscusTerm    = null;
  let giscusTimer   = null;

  function giscusTheme() {
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }
  function showCommentsFallback() {
    clearTimeout(giscusTimer);
    giscusFailed = true;
    giscusHost.hidden = true;
    giscusHost.innerHTML = '';
    commentsFallback.hidden = false;
    panelComments.classList.remove('is-loaded');
  }

  function sendGiscusConfig(extra) {
    const frame = giscusHost.querySelector('iframe.giscus-frame');
    if (!frame) return;
    frame.contentWindow.postMessage({
      giscus: { setConfig: Object.assign({ theme: giscusTheme() }, extra || {}) }
    }, GISCUS_ORIGIN);
  }
  function mountGiscus() {
    if (!currentSlug || giscusFailed) return;

    /* data.jsonc 还没加载完就点了评论：等数据就绪再挂载，
       否则会拿空配置误判成「评论不可用」并永久锁死 */
    if (!window.SITE_DATA) {
      window.__siteDataReady.then(function () {
        if (openPanel === 'comments' && !giscusFailed) mountGiscus();
      });
      return;
    }

    const cfg = window.GISCUS || {};

    /* 配置不完整时使用占位，不发起第三方请求 */
    if (!cfg.repo || !cfg.repoId || !cfg.category || !cfg.categoryId) {
      showCommentsFallback();
      return;
    }

    if (giscusMounted) {
      if (giscusTerm !== currentSlug) {
        giscusTerm = currentSlug;
        sendGiscusConfig({
          term: giscusTerm,
          backLink: location.origin + location.pathname + '#/post/' + giscusTerm
        });
        cmBody.scrollTop = 0;
      }
      return;
    }

    giscusMounted = true;
    giscusTerm = currentSlug;
    giscusHost.hidden = false;
    commentsFallback.hidden = true;
    /* 有真实内容后换掉磨砂背景（高度不再由 JS 控制） */
    panelComments.classList.add('is-loaded');

    const s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-repo', cfg.repo);
    s.setAttribute('data-repo-id', cfg.repoId);
    s.setAttribute('data-category', cfg.category);
    s.setAttribute('data-category-id', cfg.categoryId);
    s.setAttribute('data-mapping', cfg.mapping || 'specific');
    s.setAttribute('data-term', giscusTerm);
    s.setAttribute('data-strict', cfg.strict == null ? '1' : String(cfg.strict));
    s.setAttribute('data-reactions-enabled', cfg.reactionsEnabled == null ? '1' : String(cfg.reactionsEnabled));
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', cfg.inputPosition || 'bottom');
    s.setAttribute('data-theme', giscusTheme());
    s.setAttribute('data-lang', cfg.lang || 'zh-CN');
    s.onerror = showCommentsFallback;
    giscusHost.appendChild(s);

    /* 超时也没有出现 iframe，视为加载失败 */
    giscusTimer = setTimeout(function () {
      if (!giscusHost.querySelector('iframe.giscus-frame')) showCommentsFallback();
    }, 12000);
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== GISCUS_ORIGIN || !e.data || !e.data.giscus) return;
    var err = e.data.giscus.error;
    /* 该文章还没有人评论时 giscus 会返回「Discussion not found」，
       这是正常状态（首次发评论时自动建讨论），不是加载失败 */
    if (err && String(err).indexOf('Discussion not found') === -1) {
      showCommentsFallback();
      return;
    }
    clearTimeout(giscusTimer);
  });

  /* 站点手动切主题 / 跟随系统变化时，同步 giscus 原生主题 */
  new MutationObserver(function () {
    if (giscusMounted && !giscusFailed) sendGiscusConfig();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  btnSearchPost.addEventListener('click', function () {
    if (guardFailed()) return;
    togglePanel('search');
  });
  chapWrap.addEventListener('click', function () {
    if (guardFailed()) return;
    togglePanel('chapters');
  });
  btnFullscreen.addEventListener('click', function () {
    if (guardFailed()) return;
    setFullscreen(!isFullscreen);
  });
  fsChap.addEventListener('click', function (e) {
    const now = Date.now();
    const isDouble = e.detail >= 2 || (now - fsChapLastTap) < 300;
    if (isDouble) {
      /* 双击章节指示器：退出全屏，不触发目录切换 */
      clearTimeout(fsChapTapTimer);
      fsChapTapTimer = null;
      fsChapLastTap = 0;
      if (isFullscreen) setFullscreen(false);
      return;
    }
    /* 单击延迟执行，给双击留出判定时间 */
    fsChapLastTap = now;
    clearTimeout(fsChapTapTimer);
    fsChapTapTimer = setTimeout(function () {
      fsChapTapTimer = null;
      fsChapLastTap = 0;
      if (guardFailed()) return;
      togglePanel('chapters');
    }, 280);
  });
  $('toc-exit-fs').addEventListener('click', function () { setFullscreen(false); });

  /* 桌面端：单击 Ctrl 进入 / 退出全屏（Ctrl 组合键不触发） */
  let ctrlSolo = false;
  document.addEventListener('keydown', function (e) {
    if (!currentSlug || loadFailed) { ctrlSolo = false; return; }
    if (e.key === 'Control' && !e.repeat && !e.metaKey && !e.altKey && !e.shiftKey) { ctrlSolo = true; return; }
    ctrlSolo = false;
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'Control' && ctrlSolo && currentSlug && !loadFailed && !isEmptyPost) setFullscreen(!isFullscreen);
    ctrlSolo = false;
  });

  document.addEventListener('keydown', function (e) {
    // Ctrl/Cmd+F：文章页打开时接管为文内搜索
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f' && currentSlug && !loadFailed && !isEmptyPost) {
      e.preventDefault();
      if (openPanel !== 'search') { closeAllPanels(); _doOpen('search'); }
      searchInput.focus(); searchInput.select();
      return;
    }
    if (e.key !== 'Escape') return;
    if (copyModal.classList.contains('is-open')) { closeCopyModal(); return; }
    if (openPanel) { closeAllPanels(); return; }
    if (isFullscreen) { setFullscreen(false); return; }
    if (currentSlug) closePost();
  });

  postPage.addEventListener('contextmenu', function (e) {
    if (!postContent.contains(e.target)) e.preventDefault();
  });

  function findMeta(slug) {
    return (window.POSTS || []).find(function (d) { return d.slug === slug; }) || null;
  }

  function handleHash() {
    const m = window.location.hash.match(/^#\/post\/(.+)$/);
    if (m) {
      const meta = findMeta(m[1]);
      if (meta) { openPost(m[1], meta); return; }
      try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
    }
    if (currentSlug) closePost();
  }
  window.__siteDataReady.then(function () {
    window.addEventListener('hashchange', handleHash);
    handleHash();
  });

  /* 卡片点击：事件委托，列表由 POSTS 动态渲染 */
  function openCard(slug) {
    const target = '#/post/' + slug;
    /* hash 未变化时不会触发 hashchange（例如关闭后 hash 未被成功清除），
       此时直接走路由，保证同一卡片可以反复点击 */
    if (window.location.hash === target) handleHash();
    else window.location.hash = target;
  }
  document.getElementById('cards').addEventListener('click', function (e) {
    const card = e.target.closest('.card[data-slug]');
    if (card) openCard(card.dataset.slug);
  });
  document.getElementById('cards').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.card[data-slug]');
    if (!card) return;
    e.preventDefault();
    openCard(card.dataset.slug);
  });

  function handleViewportResize() {
    syncBlurHeight();
    if (openPanel) syncPanelPositions();
    refreshVFades();
    refreshTocFades();
  }
  window.addEventListener('resize', handleViewportResize, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportResize, { passive: true });
  }
})();

(function () {
  const navModal    = document.getElementById('nav-confirm');
  const navUrl      = document.getElementById('nav-confirm-url');
  const navCancel   = document.getElementById('nav-confirm-cancel');
  const navGo       = document.getElementById('nav-confirm-go');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  let pendingHref = '';
  let navOpen = false;
  let navReturnFocus = null;
  let boxOpen = false;

  /* ── 跳转确认 ── */
  function openNav(href) {
    pendingHref = href;
    navReturnFocus = document.activeElement;
    navUrl.textContent = href;
    navOpen = true;
    navModal.classList.add('is-open');
    navModal.setAttribute('aria-hidden', 'false');
    window.lockBackgroundScroll();
    navGo.focus({ preventScroll: true });
  }
  function closeNav() {
    if (!navOpen) return;
    navOpen = false;
    pendingHref = '';
    navModal.classList.remove('is-open');
    navModal.setAttribute('aria-hidden', 'true');
    window.unlockBackgroundScroll();
    if (navReturnFocus && navReturnFocus.isConnected) navReturnFocus.focus({ preventScroll: true });
    navReturnFocus = null;
  }
  navCancel.addEventListener('click', closeNav);
  navGo.addEventListener('click', function () {
    const href = pendingHref;
    closeNav();
    if (!href) return;
    if (/^(mailto:|tel:)/i.test(href)) { window.location.href = href; return; }
    window.open(href, '_blank', 'noopener');
  });
  navModal.addEventListener('click', function (e) {
    if (e.target === navModal) closeNav();
  });

  /* ── 灯箱 ── */
  function openBox(img) {
    lightboxImg.src = img.currentSrc || img.src;
    lightboxImg.alt = img.alt || '';
    boxOpen = true;
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    window.lockBackgroundScroll();
  }
  function closeBox() {
    if (!boxOpen) return;
    boxOpen = false;
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    window.unlockBackgroundScroll();
  }
  lightbox.addEventListener('click', closeBox);

  /* ── 全局点击拦截：capture 阶段先于页面内其他点击逻辑 ── */
  document.addEventListener('click', function (e) {
    if (navOpen || boxOpen) return;
    const t = e.target;
    if (!t || !t.closest) return;

    /* 图片优先走灯箱（含被链接包裹的图片） */
    const img = t.closest('img');
    if (img) { e.preventDefault(); openBox(img); return; }

    const a = t.closest('a[href]');
    if (!a) return;
    const raw = a.getAttribute('href');
    if (!raw || raw.charAt(0) === '#' || a.hasAttribute('download')) return;

    e.preventDefault();
    openNav(a.href);
  }, true);

  /* ── Esc 优先关闭（capture 阶段挡住文章页的 Esc 逻辑） ── */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (boxOpen) { e.preventDefault(); e.stopPropagation(); closeBox(); return; }
    if (navOpen) { e.preventDefault(); e.stopPropagation(); closeNav(); }
  }, true);
})();
</script>
