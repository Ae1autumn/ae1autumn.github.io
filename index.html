<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ae1autumn</title>
<meta name="description" content="Ae1autumn">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='none' stroke='%239b3d32' stroke-width='1.5'/%3E%3Cpath d='M8 22L16 10L24 22M11 18H21' fill='none' stroke='%239b3d32' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<style>
:root{
  /* primitives (OKLCH) */
  --p-paper:      oklch(0.955 0.014 92);
  --p-paper-2:    oklch(0.932 0.016 90);
  --p-ink:        oklch(0.265 0.022 65);
  --p-ink-soft:   oklch(0.455 0.025 70);
  --p-ink-faint:  oklch(0.62 0.022 75);
  --p-line:       oklch(0.815 0.018 85);
  --p-cinnabar:   oklch(0.505 0.165 28);
  --p-cinnabar-hi:oklch(0.46 0.155 28);

  /* semantic */
  --bg:            var(--p-paper);
  --surface:       var(--p-paper-2);
  --border:        var(--p-line);
  --text:          var(--p-ink);
  --text-2:        var(--p-ink-soft);
  --text-3:        var(--p-ink-faint);
  --title:         oklch(0.20 0.02 60);
  --accent:        var(--p-cinnabar);
  --accent-hover:  var(--p-cinnabar-hi);
  --mark-bg:       color-mix(in srgb, var(--accent) 18%, transparent);
  --shadow-drop:   rgba(46,35,24,.07);
  --scrim:         rgba(30,22,14,.28);
  --danger:        rgba(192,57,43,.55);
  --danger-bg:        rgba(192,57,43,.06);
  --danger-text:        rgba(192,57,43,.7);
  --success:        #2fae72;
  --lightbox-bg:        rgba(12,10,8,.86);
  --lightbox-shadow:rgba(0,0,0,.6);

  /* callout（GitHub 告示块） */
  --callout-note:      oklch(0.52 0.10 250);
  --callout-tip:       oklch(0.52 0.10 155);
  --callout-important: oklch(0.53 0.11 300);
  --callout-warning:   oklch(0.58 0.11 75);
  --callout-caution:   oklch(0.55 0.14 30);

  /* syntax */
  --syn-string:oklch(0.48 0.09 155);
  --syn-number:oklch(0.55 0.11 60);
  --syn-title: oklch(0.42 0.08 255);
  --syn-type:  oklch(0.50 0.08 200);

  /* type */
  --font-display: "Times New Roman", serif;
  --font-body:    "Times New Roman", serif;
  --font-mono:    "Times New Roman", serif;
  /* slogan 保留原来的展示字体，不参与全局字体统一 */
  --font-slogan:  "Cormorant Garamond", serif;

  /* metrics */
  --page-w: 720px;
  --pad-x: clamp(1.25rem, 5vw, 2rem);
  --radius: 12px;
  --hairline: 0.5px;
  --ease-out: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.32,.72,0,1);
  --header-h: 56px;
  --toolbar-h: 46px;
  --control-h: 44px;
  /* 全站块内文字统一行高（TOC / 文内搜索列表项单独保留原有紧凑值） */
  --line-height: 1.8;
  --panel-gap: 12px;
  --radius-sm: 8px;
  --radius-md: 10px;
  --z-menu: 20;
  --z-title: 30;
  --z-post: 40;
  --z-post-ui: 42;
  --z-panel-overlay: 43;
  --z-panel: 44;
  --z-modal: 60;
  --z-search: 70;
  --z-confirm: 80;
  --z-lightbox: 90;
}

[data-theme="dark"]{
  --bg:            oklch(0.185 0.008 70);
  --surface:       oklch(0.225 0.010 70);
  --border:        oklch(0.33 0.012 70);
  --text:          oklch(0.90 0.015 85);
  --text-2:        oklch(0.70 0.018 80);
  --text-3:        oklch(0.50 0.015 75);
  --title:         oklch(0.94 0.014 88);
  --accent:        oklch(0.60 0.16 30);
  --accent-hover:  oklch(0.66 0.17 30);
  --mark-bg:       color-mix(in srgb, var(--accent) 26%, transparent);
  --shadow-drop:   rgba(0,0,0,.35);
  --scrim:         rgba(0,0,0,.5);
  --syn-string:oklch(0.72 0.09 155);
  --syn-number:oklch(0.75 0.11 65);
  --syn-title: oklch(0.78 0.08 255);
  --syn-type:  oklch(0.74 0.08 200);
  --callout-note:      oklch(0.72 0.09 250);
  --callout-tip:       oklch(0.72 0.09 155);
  --callout-important: oklch(0.73 0.10 300);
  --callout-warning:   oklch(0.78 0.11 80);
  --callout-caution:   oklch(0.68 0.14 30);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:none!important;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);
  line-height:var(--line-height);
  font-feature-settings:"kern","liga","calt";
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s,color .3s;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.page{max-width:var(--page-w);margin:0 auto;padding:0 var(--pad-x)}

.title-bar{
  position:sticky;top:0;z-index:var(--z-title);
  margin:0 calc(-1 * var(--pad-x));padding:0 var(--pad-x);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:var(--hairline) solid transparent;
  transition:background-color .3s,border-color .3s;
}
.title-bar.is-scrolled{border-bottom-color:var(--border)}
.title-bar-inner{display:flex;align-items:center;gap:.7rem;height:var(--header-h)}
.site-icon{width:30px;height:30px;color:var(--accent);flex-shrink:0}
.site-title{
  font-family:var(--font-display);font-size:1.3rem;font-weight:500;
  letter-spacing:.05em;color:var(--title);flex:1;min-width:0;
}
.title-actions{display:flex;align-items:center;gap:.15rem}

.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:var(--radius-sm);flex-shrink:0;
  color:var(--text-2);
  transition:color .18s,background-color .18s,transform .18s;
}
.icon-btn:hover{color:var(--text);background:var(--surface)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#search-modal{
  position:fixed;inset:0;z-index:var(--z-search);
  display:flex;align-items:center;justify-content:center;
  background:var(--scrim);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity .25s,visibility 0s .25s;
}
#search-modal.is-open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s}
.search-dialog{
  width:min(420px,calc(100vw - 2.5rem));
  max-height:80vh;
  display:flex;flex-direction:column;gap:10px;
  background:var(--surface);
  border:var(--hairline) solid var(--border);
  border-radius:16px;
  box-shadow:0 30px 80px -20px var(--shadow-drop);
  padding:.9rem;
  transform:translateY(12px) scale(.98);
  transition:transform .35s cubic-bezier(.77,0,.175,1);
  overflow:hidden;
}
#search-modal.is-open .search-dialog{transform:translateY(0) scale(1)}
.sm-box{
  position:relative;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;height:var(--control-h);padding:0 12px;
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  background:var(--bg);
  transition:border-color .2s,background-color .2s;
}
.sm-box.is-error{
  border-color:var(--danger);
  background:var(--danger-bg);
  animation:sm-shake .38s cubic-bezier(.36,.07,.19,.97);
}
@keyframes sm-shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-6px)}
  35%{transform:translateX(6px)}
  55%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
  90%{transform:translateX(-2px)}
}
.sm-input{
  flex:1;min-width:0;border:none;background:none;outline:none;
  font-family:var(--font-body);font-size:.82rem;letter-spacing:.05em;
  color:var(--text);text-align:center;caret-color:var(--text);
}
.sm-input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sm-input::placeholder{color:var(--text-3)}
.sm-box.is-error .sm-input::placeholder{color:var(--danger-text)}
/* 模式选择：滑动指示块 */
.sm-tabs-wrap{flex-shrink:0;overflow:hidden;transition:height .35s cubic-bezier(.77,0,.175,1)}
.sm-tabs{
  position:relative;display:flex;padding:4px;
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  background:var(--bg);user-select:none;
}
.sm-tab-slider{
  position:absolute;top:4px;left:4px;height:36px;border-radius:7px;
  background:var(--surface);box-shadow:inset 0 0 0 .5px var(--text-3);
  pointer-events:none;
  transition:transform .3s cubic-bezier(.77,0,.175,1),width .3s cubic-bezier(.77,0,.175,1);
}
.sm-tab-btn{
  flex:1;height:36px;position:relative;z-index:1;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:color .25s;
}
.sm-tab-btn.is-active{color:var(--text)}
.sm-tab-btn:hover:not(.is-active){color:var(--text-2)}
.sm-tab-btn svg{display:block}
/* 收起后的三段点条 */
.sm-dots-row{display:flex;gap:4px;width:100%;height:10px;align-items:center;padding:0 2px}
.sm-dot-bar{flex:1;height:2px;border-radius:2px;background:var(--border);cursor:pointer;transition:background-color .3s}
.sm-dot-bar.is-active{background:var(--text-2)}
/* 结果 */
.sm-results{
  flex:1;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:.5rem;
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  background:var(--bg);padding:.6rem;
  scrollbar-width:none;
  transition:opacity .2s;
}
.sm-results::-webkit-scrollbar{display:none}
.sm-results.hidden{display:none}
.sm-result{
  text-align:left;flex-shrink:0;width:100%;
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  padding:.7rem .9rem;background:var(--surface);
  transition:border-color .18s,transform .18s;
}
.sm-result:hover{border-color:var(--text-3);transform:translateY(-1px)}
.sm-result-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.sm-result-date{font-family:var(--font-mono);font-size:.66rem;color:var(--text-3);letter-spacing:.04em}
.sm-result-sep{width:14px;height:1px;background:var(--border)}
.sm-result-tag{
  font-family:var(--font-mono);font-size:.62rem;color:var(--text-3);
  border:var(--hairline) solid var(--border);border-radius:5px;padding:.06rem .4rem;
  letter-spacing:.05em;text-transform:uppercase;
}
.sm-result-title{font-size:.95rem;color:var(--title)}
.sm-result-excerpt{
  font-size:.78rem;color:var(--text-2);margin-top:.25rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sm-result-foot{display:flex;justify-content:flex-end;margin-top:.3rem;color:var(--text-3);font-size:.8rem}

.slogan{padding:2.6rem 0 2.2rem}
.slogan-rule{
  display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;
}
.slogan-rule::before{content:"";width:26px;height:1px;background:var(--accent)}
.slogan-rule span{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.28em;
  text-transform:uppercase;color:var(--text-3);
}
.slogan-text{
  font-family:var(--font-slogan);
  font-size:clamp(1.5rem,4.2vw,2.1rem);
  font-weight:400;color:var(--text-2);
  letter-spacing:.02em;
}
.slogan-text em{font-style:italic;color:var(--accent)}

.feed{padding-bottom:5rem}
.feed-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:1.4rem;padding-bottom:.6rem;
  border-bottom:var(--hairline) solid var(--border);
}
.feed-head h2{font-family:var(--font-mono);font-size:.72rem;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.feed-meta{display:flex;align-items:center;gap:.5rem}
.feed-count,.feed-total,.feed-sep{font-family:var(--font-mono);font-size:.72rem;color:var(--text-3)}
.feed-count,.feed-total{display:flex;align-items:center;gap:.3rem}
.feed-count svg,.feed-total svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.feed-sep.is-empty,.feed-total.is-empty,.feed-count.is-empty{display:none}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.cards{display:flex;flex-direction:column;gap:1.1rem}

.card{
  position:relative;width:100%;min-width:0;
  border:var(--hairline) solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  padding:1.15rem 1.25rem .95rem;
  cursor:pointer;
  transition:border-color .2s,background-color .3s,transform .25s var(--ease-out),box-shadow .25s var(--ease-out);
}
.card:hover{
  border-color:var(--text-3);
  transform:translateY(-2px);
  box-shadow:0 10px 28px -12px var(--shadow-drop);
}
/* 朱砂折角：悬停时微微掀起 */
.card-corner{
  position:absolute;top:0;right:0;width:26px;height:26px;
  background:var(--accent);
  clip-path:polygon(100% 0,0 0,100% 100%);
  border-top-right-radius:var(--radius);
  transition:width .25s var(--ease-out),height .25s var(--ease-out);
}
.card:hover .card-corner{width:34px;height:34px}
.card-title{
  font-family:var(--font-display);font-size:1.18rem;font-weight:500;
  color:var(--title);margin-bottom:.55rem;
  white-space:nowrap;overflow-x:auto;overflow-y:hidden;
}
/* 卡片标题过长时横向滚动，两侧按可滚动余量渐隐 */
.card-title.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px);mask-image:linear-gradient(to right,transparent,#000 14px)}
.card-title.fade-r{-webkit-mask-image:linear-gradient(to left,transparent,#000 14px);mask-image:linear-gradient(to left,transparent,#000 14px)}
.card-title.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
/* 标题里的数字改用正文字体，避免显示字体的旧式数字 */
.title-num{font-family:var(--font-body);font-variant-numeric:lining-nums}
.card-tags{display:flex;flex-wrap:nowrap;gap:.4rem;margin-bottom:0;min-width:0;overflow-x:auto}
.card-tag{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.05em;
  color:var(--text-2);background:var(--bg);
  border:var(--hairline) solid var(--border);border-radius:6px;
  padding:.14rem .5rem;flex-shrink:0;
}
.card-excerpt{
  font-size:.88rem;color:var(--text-2);
  margin-bottom:.9rem;
  max-height:calc(var(--line-height) * 3em);
  overflow-y:auto;overflow-x:hidden;
}
.feed-error{
  padding:1.4rem 0;font-size:.85rem;color:var(--text-3);
  text-align:center;
}
.card-meta{display:flex;align-items:center;gap:.75rem}
.card-date{font-family:var(--font-mono);font-size:.74rem;color:var(--text-3);letter-spacing:.04em;flex-shrink:0}
.card-stats{display:flex;align-items:center;gap:1rem;margin-left:auto;flex-shrink:0}
.card-stat{display:flex;align-items:center;gap:.32rem;font-family:var(--font-mono);font-size:.74rem;color:var(--text-3)}
.card-stat.is-empty{display:none}
.card-stat svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.hamburger{display:block;width:17px;height:12px;position:relative}
.hb-line{position:absolute;left:0;width:17px;height:1.5px;background:currentColor;transform-origin:center;
  transition:transform .45s var(--ease-out),opacity .3s}
.hb-top{top:0}.hb-mid{top:5.25px}.hb-bot{top:10.5px}
.menu-btn.is-open .hb-top{transform:translateY(5.25px) rotate(45deg)}
.menu-btn.is-open .hb-mid{opacity:0;transform:scaleX(0)}
.menu-btn.is-open .hb-bot{transform:translateY(-5.25px) rotate(-45deg)}

.menu-overlay{
  position:fixed;inset:var(--header-h) 0 0;z-index:var(--z-menu);
  display:flex;align-items:center;justify-content:center;
  padding:1.25rem var(--pad-x) max(1.25rem,env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transform:translateY(-100%);
  pointer-events:none;visibility:hidden;
  transition:transform .42s var(--ease-out),visibility 0s .42s;
}
.menu-overlay.is-open{
  transform:translateY(0);pointer-events:auto;visibility:visible;
  transition:transform .42s var(--ease-out);
}
.menu-box{
  position:relative;
  width:220px;height:160px;flex-shrink:0;
  display:flex;flex-direction:column;gap:12px;
  padding:24px;
  background:var(--surface);
  border:var(--hairline) solid var(--border);
  border-radius:12px;
  box-shadow:0 18px 50px -18px var(--shadow-drop);
  opacity:0;
  transform:translateY(-12px) scale(.98);
  transition:transform .38s var(--ease-out),opacity .3s ease;
}
.menu-overlay.is-open .menu-box{opacity:1;transform:translateY(0) scale(1)}
/* 下方操作按钮 */
.menu-link-btn{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:100%;height:var(--control-h);padding:0;border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text-2);
  border:var(--hairline) solid var(--border);
  transition:color .18s,background-color .18s;
}
.menu-link-btn:hover{color:var(--text);background:color-mix(in srgb,var(--bg) 82%,var(--text-3))}
.menu-link-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* 链接与阅读速度并排：不改变菜单高度 */
.menu-row{display:flex;align-items:center;gap:12px;flex-shrink:0}
.menu-row .menu-link-btn{width:auto;flex:1 1 auto;min-width:0}
.menu-row .menu-icon-btn{width:44px;height:var(--control-h);flex:0 0 44px;aspect-ratio:1}
/* 上方：主题滑块（日 / 自适应 / 夜） */
.theme-slider{
  position:relative;display:flex;flex-shrink:0;height:54px;padding:4px;
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  background:var(--bg);user-select:none;
}
.theme-slider-knob{
  position:absolute;top:4px;left:4px;width:calc((100% - 8px) / 3);height:var(--control-h);
  border-radius:var(--radius-sm);background:var(--surface);
  box-shadow:inset 0 0 0 .5px var(--text-3);
  transform:translateX(calc(var(--pos,1) * 100%));
  transition:transform .28s var(--ease-spring);
  pointer-events:none;
}
.theme-seg{
  flex:1;position:relative;z-index:1;height:var(--control-h);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:color .25s;border-radius:var(--radius-sm);
}
.theme-seg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.theme-seg.is-active{color:var(--text)}
.theme-seg:hover:not(.is-active){color:var(--text-2)}

/* ════════════════════════════════════════════
   ARTICLE PAGE
════════════════════════════════════════════ */
#post-page{
  position:fixed;inset:0;z-index:var(--z-post);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);
  transition:transform .45s var(--ease-spring);
  pointer-events:none;
}
#post-page.is-open{transform:translateY(0);pointer-events:auto}

.post-blur{flex-shrink:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer}
.post-body{flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;transition:background-color .3s}

/* header：标题 + 计时 + 进度线 */
.post-header-row{
  position:relative;z-index:calc(var(--z-post) + 1);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  height:var(--toolbar-h);padding:0 1rem;
  border-top:var(--hairline) solid var(--border);
}
.post-header-row::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:var(--hairline);background:var(--border)}
.post-header-row::before{
  content:"";position:absolute;left:0;bottom:0;height:1.5px;z-index:1;
  width:var(--post-progress,0%);background:var(--accent);
  transition:width .12s linear,opacity .12s linear;
}
/* 加载中的进度条：由 fetch 实际进度驱动（见 JS setLoadProgress），无无限动画 */
.post-header-title{
  font-family:var(--font-display);font-size:1rem;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.post-timer{display:flex;align-items:center;gap:.32rem;font-family:var(--font-mono);font-size:.72rem;color:var(--text-3);letter-spacing:.04em;flex-shrink:0}
.post-timer-icon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.post-timer-sep{color:var(--border)}
.post-timer-num{display:inline-block;min-width:2ch}

.post-reload-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem}
.post-reload-hint{font-size:.85rem;color:var(--text-3)}
.post-reload-btn{
  border:var(--hairline) solid var(--border);border-radius:var(--radius);
  color:var(--text-2);font-family:var(--font-mono);font-size:.8rem;letter-spacing:.08em;
  padding:.5rem 1.3rem;transition:border-color .2s,color .2s;
}
.post-reload-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 空文章：居中提示 + 禁用态 */
.post-content.is-empty{display:flex;align-items:center;justify-content:center;padding:0}
.post-empty{font-size:.9rem;color:var(--text-3);letter-spacing:.04em;text-align:center;padding:0 var(--pad-x)}
#post-page.is-empty-post .post-toolbar-actions .icon-btn:disabled:not(#btn-comments){
  opacity:.35;pointer-events:none;
}
#post-page.is-empty-post .post-chapters-wrap:disabled,
#post-page.is-empty-post .fs-chap:disabled{pointer-events:none}

/* toolbar：章节指示 + 操作 */
.post-toolbar-row{
  position:relative;z-index:var(--z-post-ui);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  height:var(--toolbar-h);padding:0 .6rem 0 1rem;
  border-bottom:var(--hairline) solid var(--border);
}
.post-chapters-wrap{
  display:flex;align-items:center;flex:0 1 auto;min-width:0;max-width:50%;overflow:hidden;
  height:100%;cursor:pointer;border-radius:6px;
}
.post-chapter-block{
  display:flex;align-items:center;gap:.45rem;
  white-space:nowrap;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  font-family:var(--font-mono);font-size:.72rem;color:var(--text-2);letter-spacing:.02em;
  flex:0 1 auto;min-width:0;max-width:100%;
  transition:max-width .35s var(--ease-out),opacity .25s;
}
.post-chapter-block::-webkit-scrollbar{display:none}
.post-chapter-block .chap-text{white-space:nowrap}
/* 截断边缘渐隐（由 JS 按可滚动余量切换） */
.post-chapter-block.fade-l{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16px);
  mask-image:linear-gradient(to right,transparent,#000 16px);
}
.post-chapter-block.fade-r{
  -webkit-mask-image:linear-gradient(to left,transparent,#000 16px);
  mask-image:linear-gradient(to left,transparent,#000 16px);
}
.post-chapter-block.fade-l.fade-r{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);
}
/* 章节切换：文本自下方滚入 */
@keyframes chap-roll-in{
  from{transform:translateY(.85em);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.chap-text.chap-in{animation:chap-roll-in .32s var(--ease-out)}
@media (prefers-reduced-motion:reduce){
  .chap-text.chap-in{animation:none}
}
.post-chapter-sep{
  font-family:var(--font-mono);font-size:.72rem;color:var(--text-3);flex-shrink:0;
  overflow:hidden;max-width:2.2em;padding:0 .5em;white-space:nowrap;
  transition:max-width .35s var(--ease-out),opacity .25s,padding .35s var(--ease-out);
}
.post-chapter-sep.collapsed{max-width:0!important;padding:0;opacity:0}
.post-chapter-block.collapsed{max-width:0!important;opacity:0;pointer-events:none}
.post-chapters-hint{
  font-family:var(--font-mono);font-size:.72rem;color:var(--text-3);letter-spacing:.04em;
  transition:opacity .25s;
}
.post-chapters-hint.collapsed{opacity:0;max-width:0;overflow:hidden}
.post-toolbar-actions{display:flex;align-items:center;gap:.05rem;flex-shrink:0}
.post-toolbar-actions .icon-btn{width:36px;height:36px}
.post-toolbar-actions .icon-btn svg{width:16px;height:16px}
.post-toolbar-actions .icon-btn.is-active{color:var(--accent);background:var(--surface)}

/* ── 全屏阅读模式 ── */
#post-page.is-fullscreen .post-toolbar-row,
#post-page.is-fullscreen .post-header-row,
#post-page.is-fullscreen .post-blur{display:none}
#post-page.is-fullscreen .post-content{padding-top:4.4rem}
.fs-float{
  position:fixed;top:calc(12px + env(safe-area-inset-top));z-index:var(--z-post-ui);
  display:none;align-items:center;
  height:38px;padding:0 .8rem;
  background:color-mix(in srgb,var(--surface) 72%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:var(--hairline) solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 8px 24px -12px var(--shadow-drop);
}
#post-page.is-fullscreen .fs-float{display:flex}
.fs-chap{
  /* 最宽时两侧各留 12px，并与已用时间隔开 12px（时间条约 60px） */
  left:var(--panel-gap);max-width:calc(100vw - 96px);overflow:hidden;cursor:pointer;
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.02em;color:var(--text-2);
  transition:border-color .18s;touch-action:manipulation;
}
.fs-chap:hover{border-color:var(--accent)}
/* 阅读进度：背景填充（宽度由 JS 写入 --fs-progress） */
.fs-chap::before{
  content:"";position:absolute;left:0;top:0;bottom:0;border-radius:inherit;
  width:var(--fs-progress,0%);
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  transition:width .12s linear;pointer-events:none;
}
.fs-chap > *{position:relative}
/* 不用容器 gap：折叠元素也会占 gap，导致右侧多余空隙 */
.fs-chap-block{
  display:flex;align-items:center;white-space:nowrap;min-width:0;max-width:100%;
  flex:1 1 0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  transition:max-width .35s var(--ease-out),opacity .25s,margin .35s var(--ease-out);
}
.fs-chap-block::-webkit-scrollbar{display:none}
.fs-chap-block:not(.collapsed){margin-left:.45rem}
.fs-chap-hint.collapsed + .fs-chap-block:not(.collapsed){margin-left:0}
.fs-chap-block .chap-text{white-space:nowrap}
/* 截断边缘渐隐：与正常模式一致（由 JS 按可滚动余量切换） */
.fs-chap-block.fade-l{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16px);
  mask-image:linear-gradient(to right,transparent,#000 16px);
}
.fs-chap-block.fade-r{
  -webkit-mask-image:linear-gradient(to left,transparent,#000 16px);
  mask-image:linear-gradient(to left,transparent,#000 16px);
}
.fs-chap-block.fade-l.fade-r{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);
}
.fs-chap-block.collapsed{max-width:0!important;margin-left:0!important;opacity:0;pointer-events:none}
.fs-chap-sep{color:var(--text-3);flex-shrink:0;overflow:hidden;max-width:2.2em;padding:0 .5em;white-space:nowrap;
  transition:max-width .35s var(--ease-out),opacity .25s,padding .35s var(--ease-out)}
.fs-chap-sep.collapsed{max-width:0!important;padding:0;opacity:0}
.fs-chap-hint{color:var(--text-3);letter-spacing:.04em;transition:opacity .25s}
.fs-chap-hint.collapsed{opacity:0;max-width:0;overflow:hidden}
/* 普通模式没有章节时隐藏「目录」文字，但保留按钮点击区域 */
.post-chapters-wrap.is-empty .post-chapters-hint{opacity:0}
.fs-timer{
  right:var(--panel-gap);flex-shrink:0;gap:.32rem;
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;color:var(--text-3);
}
.fs-timer svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.fs-timer.is-error svg{display:none}
/* 全屏时 TOC 标题栏额外显示「退出全屏」 */
#toc-exit-fs{display:none}
#post-page.is-fullscreen ~ #panel-chapters #toc-exit-fs{display:flex}

/* content */
.post-content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:2.4rem var(--pad-x) 6rem;
}
.post-content-inner{max-width:65ch;margin:0 auto}

/* markdown 排版 */
.post-content h1,.post-content h2,.post-content h3,.post-content h4{
  font-family:var(--font-display);font-weight:500;color:var(--title);
  margin:2.4rem 0 .9rem;scroll-margin-top:1rem;
  font-variant-numeric:lining-nums;
}
.post-content h1{font-size:1.55rem}
.post-content h2{font-size:1.3rem}
.post-content h3{font-size:1.12rem}
.post-content h4{font-size:1rem;color:var(--text-2)}
.post-content h1:first-child,.post-content h2:first-child{margin-top:0}
.post-content p{font-size:.95rem;color:var(--text-2);margin-bottom:1.1rem;letter-spacing:.01em}
.post-content strong{color:var(--text);font-weight:600}
.post-content code{font-family:var(--font-mono);font-size:.8rem;background:var(--surface);border:var(--hairline) solid var(--border);border-radius:6px;padding:.12em .4em}
.post-content pre{background:var(--surface);border:var(--hairline) solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;overflow-x:auto;margin:0 0 1.2rem}
.post-content pre code{background:none;border:none;padding:0;border-radius:0}

/* 代码块折叠：高度超过正文容器的 <pre> 才会被包进 .code-block，短代码块保持原样 */
.post-content .code-block{
  position:relative;
  margin:0 0 1.2rem;border:var(--hairline) solid var(--border);border-radius:var(--radius);
  background:var(--surface);overflow:hidden;
  transition:border-color .18s,background-color .18s;
}
.post-content .code-block.is-collapsed{cursor:pointer}
.post-content .code-block.is-static{cursor:pointer}
.post-content .code-block pre{margin:0;border:none;border-radius:0;background:none}
/* 头栏与站内控件同一套高度与间距 */
.post-content .code-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--panel-gap);
  height:var(--control-h);padding:0 var(--panel-gap);
  border-bottom:var(--hairline) solid var(--border);
  font-family:var(--font-mono);font-size:.72rem;line-height:1;color:var(--text-3);
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.post-content .code-toggle{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:28px;height:28px;margin-left:-7px;border-radius:var(--radius-sm);
  color:var(--text-2);
  transition:color .18s,background-color .18s;
}
.post-content .code-toggle:hover{color:var(--accent);background:color-mix(in srgb,var(--border) 45%,transparent)}
.post-content .code-chevron{
  width:16px;height:16px;
  fill:currentColor;stroke:currentColor;stroke-width:2.4;
  stroke-linejoin:round;stroke-linecap:round;
  transition:transform .22s var(--ease-out);
}
.post-content .code-block:not(.is-collapsed) .code-chevron{transform:rotate(90deg)}
.post-content .code-meta{display:flex;align-items:center;gap:.38rem;letter-spacing:.03em;white-space:nowrap}
.post-content .code-lines{color:var(--text-3)}
.post-content .code-sep{opacity:.5}
.post-content .code-lang{
  padding:0;border:none;background:none;
  font:inherit;letter-spacing:inherit;color:var(--text-2);
  transition:color .18s;
}
.post-content .code-lang:hover{color:var(--accent)}
/* 复制成功：整块转绿，中央对勾，2s 后恢复（配色复用 --success） */
.post-content .code-block.is-copied{
  border-color:color-mix(in srgb,var(--success) 62%,transparent);
  background:color-mix(in srgb,var(--success) 28%,var(--surface));
}
.post-content .code-check{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--success) 28%,var(--surface));
  color:var(--success);opacity:0;pointer-events:none;
  transition:opacity .16s;
}
.post-content .code-block.is-copied .code-check{opacity:1}
.post-content .code-check svg{
  width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.post-content .code-body{position:relative}
/* 折叠后整块只剩顶栏一行 */
.post-content .code-block.is-collapsed .code-body{display:none}
.post-content .code-block.is-collapsed .code-head{border-bottom:none}
.post-content blockquote{border-left:var(--hairline) solid var(--accent);margin:1.2rem 0;padding:.4rem 0 .4rem 1.1rem;color:var(--text-3)}
.post-content blockquote p{margin-bottom:.5rem}
.post-content a{color:var(--accent)}
.post-content hr{border:none;border-top:var(--hairline) solid var(--border);margin:2.4rem auto;width:100%}
.post-content img{max-width:100%;border-radius:var(--radius);border:var(--hairline) solid var(--border);margin:1.2rem 0}
/* 原生媒体：iframe / video / audio 不再被 overflow-x:hidden 裁掉 */
.post-content iframe{display:block;width:100%;max-width:100%;aspect-ratio:16/9;height:auto;
  border:var(--hairline) solid var(--border);border-radius:var(--radius);margin:1.2rem 0;background:var(--surface)}
.post-content video{display:block;max-width:100%;height:auto;border-radius:var(--radius);margin:1.2rem 0;background:#000}
.post-content audio{display:block;width:100%;margin:1.2rem 0}
.post-content embed,.post-content object{max-width:100%}
.post-content figure{margin:1.2rem 0}
.post-content figure img{margin:0}
.post-content figcaption{margin-top:.5rem;font-size:.78rem;color:var(--text-3);text-align:center}
.post-content ul,.post-content ol{padding-left:1rem;margin-bottom:1.1rem;color:var(--text-2);font-size:.95rem}
/* li 可横向滚动后，outside 标记会被溢出裁剪，改为 inside 保留圆点/序号 */
.post-content li{margin-bottom:.3rem;overflow-x:auto;list-style-position:inside}
/* 宽松列表里段落是块级 <p>，inside 标记会被挤到上一行：首个段落内联化 */
.post-content li > p{display:inline;margin:0}
.post-content li > p + p{display:block;margin:.5rem 0 0}

/* markdown 补充：表格 / 任务列表 / 删除线 / 深级标题 */
.post-content h5,.post-content h6{font-family:var(--font-display);font-weight:500;color:var(--text-2);margin:2rem 0 .8rem;scroll-margin-top:1rem;font-variant-numeric:lining-nums}
.post-content h5{font-size:.95rem}
.post-content h6{font-size:.88rem;color:var(--text-3)}
.post-content .table-wrap{
  overflow-x:auto;overflow-y:hidden;margin:0 0 1.2rem;
  border:var(--hairline) solid var(--border);border-radius:var(--radius);
}
/* 可滚动余量的边缘渐隐（与 .sr-scroll 同一套交互语言） */
.post-content .table-wrap.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px);mask-image:linear-gradient(to right,transparent,#000 14px)}
.post-content .table-wrap.fade-r{-webkit-mask-image:linear-gradient(to left,transparent,#000 14px);mask-image:linear-gradient(to left,transparent,#000 14px)}
.post-content .table-wrap.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
/* separate 模型：外框归容器，单元格只留内侧分隔线，圆角才能干净 */
.post-content table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:.85rem}
.post-content th,.post-content td{border-right:var(--hairline) solid var(--border);border-bottom:var(--hairline) solid var(--border);padding:.45rem .8rem;text-align:left;vertical-align:top}
.post-content th{background:var(--surface);font-weight:600;color:var(--text);white-space:nowrap}
.post-content td{color:var(--text-2)}
/* 每列保底宽度：列多/内容宽时撑出容器触发横向滚动，而不是被压缩 */
.post-content td{min-width:5em}
.post-content tr > *:last-child{border-right:none}
.post-content tbody tr:last-child > *{border-bottom:none}
/* marked 用 align 属性表达列对齐，优先级需盖过上面的 text-align */
.post-content [align="center"]{text-align:center}
.post-content [align="right"]{text-align:right}
.post-content tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface) 55%,transparent)}
.post-content li:has(> input[type="checkbox"]){list-style:none;margin-left:-1rem}
.post-content input[type="checkbox"]{accent-color:var(--accent);width:.8rem;height:.8rem;margin:0 .45rem 0 0;vertical-align:-1px}
.post-content del{color:var(--text-3);text-decoration-color:color-mix(in srgb,var(--accent) 53%,transparent)}

/* markdown 内联 HTML：标记 / 键帽 / 折叠块 / 上下标，接入既有纸墨 token */
.post-content mark{background:var(--mark-bg);color:var(--text);border-radius:2px;padding:0 .1em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.post-content kbd{font-family:var(--font-mono);font-size:.78em;color:var(--text);
  background:var(--surface);border:var(--hairline) solid var(--border);border-radius:5px;
  padding:.08em .38em;margin:0 .06em;white-space:nowrap;box-shadow:0 1px 0 var(--border)}
.post-content details{margin:0 0 1.2rem;padding:.7rem .9rem;border:var(--hairline) solid var(--border);
  border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.post-content details[open]{padding-bottom:.85rem}
.post-content summary{cursor:pointer;color:var(--text);font-size:.92rem;transition:color .18s}
.post-content summary:hover{color:var(--accent)}
.post-content summary::marker{color:var(--accent)}
.post-content details > *:not(summary){margin-top:.6rem}
.post-content details p{margin-bottom:.7rem}
.post-content details > *:not(summary):last-child{margin-bottom:0}
.post-content sub,.post-content sup:not(:has(> a[data-footnote-ref])){font-size:.72em;line-height:0;
  position:relative;vertical-align:baseline}
.post-content sub{bottom:-.28em}
.post-content sup:not(:has(> a[data-footnote-ref])){top:-.42em}
.post-content ins{text-decoration-color:var(--accent);text-decoration-thickness:1px}
.post-content u{text-decoration-color:color-mix(in srgb,var(--accent) 65%,transparent);text-underline-offset:2px}
.post-content abbr[title]{text-decoration:underline dotted var(--text-3);text-underline-offset:2px;cursor:help}

/* GitHub 告示块：> [!NOTE] 等 */
.post-content .callout{
  margin:1.3rem 0;padding:.8rem 1rem;
  border-left:2px solid var(--callout-c);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  background:color-mix(in srgb,var(--callout-c) 9%,transparent);
}
.post-content .callout-title{
  margin:0 0 .4rem;font-size:.76rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--callout-c);
}
.post-content .callout-body > :last-child{margin-bottom:0}
.post-content .callout-body p{font-size:.9rem}
.post-content .callout-note{--callout-c:var(--callout-note)}
.post-content .callout-tip{--callout-c:var(--callout-tip)}
.post-content .callout-important{--callout-c:var(--callout-important)}
.post-content .callout-warning{--callout-c:var(--callout-warning)}
.post-content .callout-caution{--callout-c:var(--callout-caution)}

/* 定义列表 */
.post-content dl{margin:0 0 1.2rem;font-size:.95rem;color:var(--text-2)}
.post-content dt{font-weight:600;color:var(--text);margin-top:.7rem}
.post-content dt:first-child{margin-top:0}
.post-content dd{margin:.2rem 0 0 1.2rem}

.post-content a{overflow-wrap:anywhere}

.post-content .hljs-string,.post-content .hljs-regexp,.post-content .hljs-addition,.post-content .hljs-meta .hljs-string{color:var(--syn-string)}

.post-content .hljs-title,.post-content .hljs-title.function_,.post-content .hljs-section,.post-content .hljs-name{color:var(--syn-title)}
.post-content .hljs-built_in,.post-content .hljs-type,.post-content .hljs-class .hljs-title,.post-content .hljs-title.class_{color:var(--syn-type)}
.post-content .hljs-attr,.post-content .hljs-attribute,.post-content .hljs-variable,.post-content .hljs-template-variable,.post-content .hljs-selector-class,.post-content .hljs-selector-id{color:var(--text-2)}
.post-content .hljs-comment,.post-content .hljs-quote{color:var(--text-3);font-style:italic}
.post-content .hljs-deletion{color:var(--accent)}
.post-content .hljs-emphasis{font-style:italic}
.post-content .hljs-strong{font-weight:600}
.post-content .hljs-meta,.post-content .hljs-doctag{color:var(--syn-type)}
.post-content .hljs-tag,.post-content .hljs-punctuation{color:var(--text-3)}
.post-content .hljs-params,.post-content .hljs-subst{color:var(--text-2)}
.post-content .hljs-property{color:var(--syn-title)}

/* KaTeX 公式 */

/* 脚注 */

#panel-overlay{position:fixed;inset:0;z-index:var(--z-panel-overlay);display:none}

.panel{position:fixed;z-index:var(--z-panel);pointer-events:none;visibility:hidden}
.panel.is-ready{visibility:visible}
.panel-box{
  position:relative;max-height:inherit;
  background:var(--surface);border:var(--hairline) solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 18px 50px -18px var(--shadow-drop);
  pointer-events:auto;will-change:transform;
  display:flex;flex-direction:column;overflow:hidden;
}
/* 磨砂面板：数值与全屏章节指示器一致（surface 72% + blur 10px） */
#panel-chapters .panel-box,
#panel-search .panel-box,

  background:color-mix(in srgb,var(--surface) 72%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
/* 左右面板：宽度≈容器一半，高度随内容，上限由 JS 约束 */

#panel-chapters .panel-box{transform:translateX(calc(-100% - 20px));transition:transform .36s var(--ease-spring)}

/* 高度完全交给 CSS：顶部由 JS 定位，底部固定留 GAP，剩余空间即是最大高度。
   内容不足时最小 180px，超出部分由 .panel 裁剪 */

  bottom:var(--panel-gap,12px);
  overflow:hidden;
}
#panel-comments .panel-box{
  height:auto;min-height:180px;max-height:100%;
  transform:translateY(-100%);transition:transform .36s var(--ease-spring);
}
#panel-comments.is-open .panel-box{transform:translateY(0)}

/* 面板通用内件 */
.panel-head{

}

.panel-head-actions{display:flex;align-items:center;gap:.2rem;flex-shrink:0}
.panel-close{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:color .18s,background-color .18s}
.panel-close:hover{color:var(--text);background:var(--bg)}
.panel-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* 章节面板 */
.toc-list{padding:.3rem .55rem .6rem}

  --toc-pad:.6rem;

  padding:.65rem .6rem;padding-left:var(--toc-pad);border-radius:0;
  font-size:.85rem;line-height:1.5;color:var(--text-2);/* 目录项：与文内搜索结果项一致，统一 1.5 */

}
.toc-item:hover{background:var(--bg);color:var(--text)}
.toc-item .toc-no{font-family:var(--font-mono);font-size:.66rem;color:var(--text-3);flex-shrink:0;letter-spacing:.03em}
/* 目录文字单行横向滚动；编号固定在左侧，不跟着滚走 */

/* 截断边缘渐隐（与 .sr-scroll / .table-wrap 同一套 14px 渐变） */
.toc-item .toc-scroll.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px);mask-image:linear-gradient(to right,transparent,#000 14px)}

.toc-item .toc-scroll.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}

.toc-item.lv-5{--toc-pad:3.9rem;font-size:.78rem}
.toc-item.lv-6{--toc-pad:4.4rem;font-size:.76rem}
.toc-item.is-active{color:var(--accent)}

.toc-empty{padding:2rem 1rem;text-align:center;font-size:.8rem;color:var(--text-3)}

/* 搜索面板 */
.search-field{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-bottom:var(--hairline) solid var(--border);flex-shrink:0}
.search-field svg{width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:1.5;stroke-linecap:round;flex-shrink:0}
.search-input{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--font-body);font-size:.88rem;color:var(--text)}
.search-input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search-input::placeholder{color:var(--text-3)}
.search-meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:.4rem 1rem;border-bottom:var(--hairline) solid var(--border);flex-shrink:0;
}
.search-count{font-family:var(--font-mono);font-size:.7rem;color:var(--text-3);letter-spacing:.05em;min-height:1em}
.search-nav{display:flex;gap:.15rem}
.search-nav .icon-btn{width:30px;height:30px}
.search-nav .icon-btn svg{width:14px;height:14px}
.search-nav .icon-btn:disabled{opacity:.3;pointer-events:none}
/* 文内搜索结果列表 */
.sr-results{padding:.3rem .55rem .6rem;display:flex;flex-direction:column}
.sr-results:empty{display:none}
.sr-item{
  display:block;width:100%;text-align:left;
  padding:.6rem;border-radius:0;
  font-size:.8rem;line-height:1.5;color:var(--text-2);/* 文内搜索结果项：与目录项一致，统一 1.5 */
  transition:background-color .15s,color .15s;
}
.sr-item + .sr-item{border-top:var(--hairline) solid var(--border)}
.sr-item:hover{background:var(--bg);color:var(--text)}

}

.sr-scroll.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px);mask-image:linear-gradient(to right,transparent,#000 14px)}
.sr-scroll.fade-r{-webkit-mask-image:linear-gradient(to left,transparent,#000 14px);mask-image:linear-gradient(to left,transparent,#000 14px)}
.sr-scroll.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}

/* 纵向边缘渐隐（正文 / 目录 / 搜索结果共用）：有隐藏内容的一侧文字淡出 */
.fade-t{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px);mask-image:linear-gradient(to bottom,transparent,#000 16px)}
.fade-b{-webkit-mask-image:linear-gradient(to top,transparent,#000 16px);mask-image:linear-gradient(to top,transparent,#000 16px)}
.fade-t.fade-b{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 16px),transparent)}

/* 评论面板 */
/* flex-basis:auto：父级高度改为 auto 后，靠内容撑开；超过 max-height 时再收缩并滚动 */
.cm-body{flex:1 1 auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.giscus-host{width:100%;flex:0 0 auto}
.giscus-host[hidden]{display:none}
.giscus-host iframe{width:100%!important}

/* 未配置 key 或加载失败时的占位：居中一行 */
.comments-placeholder{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:2rem 1rem;text-align:center;color:var(--text-3);
  font-size:.78rem;letter-spacing:.04em;
}

#copy-modal{
  position:fixed;inset:0;z-index:var(--z-modal);

  transition:opacity .22s,visibility 0s .22s;
}

.copy-box{
  width:min(320px,calc(100vw - 3rem));

  background:color-mix(in srgb,var(--surface) 72%,transparent);

<script>
/* ═══════════════ 站点数据 ═══════════════
   所有需要手工维护的数据都在 ./data.jsonc：posts 文章列表、
   goatcounter 阅读量、giscus 评论。文件支持行注释、块注释和尾随逗号。
   页面通过 fetch 读取，需用 HTTP(S) 打开（GitHub Pages 或本地静态服务器），
   与文章 Markdown 的加载方式一致。
   依赖数据的模块都等待 window.__siteDataReady 后再初始化。 */
(function () {
  /* 极简 JSONC 解析：去掉注释和对象/数组的尾随逗号，
     字符串内的内容（含 // 和逗号）原样保留 */
  function parseJsonc(src) {
    var out = '', i = 0, n = src.length, inStr = false;
    while (i < n) {
      var ch = src[i], next = src[i + 1];
      if (inStr) {
        out += ch;
        if (ch === '\\') { out += next || ''; i += 2; continue; }
        if (ch === '"') inStr = false;
        i += 1; continue;
      }
      if (ch === '"') { inStr = true; out += ch; i += 1; continue; }
      if (ch === '/' && next === '/') { while (i < n && src[i] !== '\n') i += 1; continue; }
      if (ch === '/' && next === '*') {
        i += 2;
        while (i < n && !(src[i] === '*' && src[i + 1] === '/')) {
          if (src[i] === '\n') out += '\n';
          i += 1;
        }
        i += 2; continue;
      }
      if (ch === ',') {
        /* 向后跳过空白和注释，若紧跟 } 或 ] 则丢弃这个逗号 */
        var j = i + 1;
        while (j < n) {
          var c = src[j];
          if (c === ' ' || c === '\t' || c === '\r' || c === '\n') { j += 1; continue; }
          if (c === '/' && src[j + 1] === '/') { while (j < n && src[j] !== '\n') j += 1; continue; }
          if (c === '/' && src[j + 1] === '*') {
            j += 2;
            while (j < n && !(src[j] === '*' && src[j + 1] === '/')) j += 1;
            j += 2; continue;
          }
          break;
        }
        if (src[j] === '}' || src[j] === ']') { i += 1; continue; }
      }
      out += ch; i += 1;
    }
    return JSON.parse(out);
  }

  /* 加时间戳 + 禁用缓存：data.jsonc 被 CDN 缓存时，改完配置要等很久才生效 */
  window.__siteDataReady = fetch('./data.jsonc?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('data.jsonc: HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) {
      var data = parseJsonc(text);
      window.SITE_DATA = data;
      window.POSTS = data.posts || [];
      window.GOATCOUNTER = data.goatcounter || {};
      window.GISCUS = data.giscus || {};
      return data;
    })
    .catch(function (err) {
      window.__siteDataError = err;
      window.POSTS = [];
      window.GOATCOUNTER = {};
      window.GISCUS = {};
      console.error('[site-data] 加载 data.jsonc 失败：', err);
      return { posts: [] };
    });
})();

/* 访问统计：不加载 gc.zgo.at 的 count.js（该域名在部分网络不可达，
   会导致一条 pageview 都发不出去），直接按 GoatCounter 的 /count 协议发命中。
   等 data.jsonc 就绪后再发，避免直接带 hash 打开文章时漏记。 */
window.trackPostView = function (slug, title) {
  if (!slug) return;
  window.__siteDataReady.then(function () {
    var cfg = window.GOATCOUNTER;
    if (!cfg || !cfg.code) return;
    var host = location.hostname;
    if (location.protocol === 'file:' ||
        /(^localhost$|^127\.|^10\.|^192\.168\.|^0\.0\.0\.0$)/.test(host)) return;
    var path = (typeof cfg.pathPrefix === 'string' ? cfg.pathPrefix : '/') + slug;
    var url = 'https://' + cfg.code + '.goatcounter.com/count' +
      '?p=' + encodeURIComponent(path) +
      '&r=' + encodeURIComponent(document.referrer || '') +
      '&t=' + encodeURIComponent(title || document.title || '') +
      '&s=' + (window.screen ? window.screen.width : 0) +
      '&b=0&rnd=' + Math.random().toString(36).slice(2, 7);
    if (navigator.sendBeacon && navigator.sendBeacon(url)) return;
    var img = new Image();
    img.src = url;
  });
};

window.escapeHTML = function (value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
};

/* 文章元数据缺省值：标题 / 简介 / 日期缺失时显示占位，标签缺失时留白 */
window.postValue = function (value, fallback) {
  return value == null || String(value).trim() === '' ? fallback : value;
};
window.postTags = function (post) {
  if (!post || !Array.isArray(post.tags)) return [];
  return post.tags.filter(function (t) {
    return t != null && String(t).trim() !== '';
  });
};
/* 标题里的数字（含 07.02 / 2026-07-02 这种连续数字）改用正文字体 */
window.formatTitle = function (value) {
  var s = String(value == null ? '' : value);
  var re = /[0-9]+(?:[.\-/][0-9]+)*/g;
  var out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += window.escapeHTML(s.slice(last, m.index));
    out += '<span class="title-num">' + window.escapeHTML(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + window.escapeHTML(s.slice(last));
};

window.__siteDataReady.then(function renderFeed() {
  var EYE = '<svg viewBox="0 0 24 24"><use href="#i-eye"/></svg>';
  var esc = window.escapeHTML;

  /* 置顶优先；多篇置顶按日期从新到旧，其余保持数组原序（sort 稳定） */
  var feed = window.POSTS.slice().sort(function (a, b) {
    if (!!b.pin !== !!a.pin) return b.pin ? 1 : -1;
    if (a.pin && b.pin) return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
    return 0;
  });

  var html = feed.map(function (p) {
    var tags = window.postTags(p).map(function (t) {
      return '<span class="card-tag">' + esc(t) + '</span>';
    }).join('');
    return '<article class="card" tabindex="0" role="link" data-slug="' + esc(p.slug) + '" data-src="' + esc(p.src) + '">' +
      (p.pin ? '<div class="card-corner" aria-hidden="true"></div>' : '') +
      '<h2 class="card-title">' + window.formatTitle(window.postValue(p.title, 'Untitled')) + '</h2>' +
      '<p class="card-excerpt">' + esc(window.postValue(p.excerpt, 'Description')) + '</p>' +
      '<div class="card-meta">' +
        '<span class="card-date">' + esc(window.postValue(p.date, 'Date')) + '</span>' +
        (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
        '<div class="card-stats">' +
          '<span class="card-stat card-views is-empty" data-views="' + esc(p.slug) + '" aria-label="阅读量">' +
            EYE + '<span class="views-num"></span>' +
          '</span>' +
        '</div>' +
      '</div>' +
    '</article>';

  var cardsEl = document.getElementById('cards');
  var feedCnt = document.getElementById('feed-count');
  var feedCntNum = document.getElementById('feed-count-num');
  if (window.__siteDataError) {
    if (cardsEl) cardsEl.innerHTML = '<p class="feed-error">很抱歉消失在了你的视野之中</p>';
    if (feedCntNum) feedCntNum.textContent = '';
    return;
  }
  if (cardsEl) cardsEl.innerHTML = html;
  if (feedCntNum) feedCntNum.textContent = window.POSTS.length;
  if (feedCnt) feedCnt.classList.remove('is-empty');

  /* 卡片标题横向 / 简介纵向滚动的边缘渐隐 */
  function updateCardTitleFade(el) {
    var over = el.scrollWidth > el.clientWidth + 1;
    el.classList.toggle('fade-l', over && el.scrollLeft > 1);
    el.classList.toggle('fade-r', over && el.scrollLeft < el.scrollWidth - el.clientWidth - 1);
  }
  function updateCardExcerptFade(el) {
    var over = el.scrollHeight > el.clientHeight + 1;
    el.classList.toggle('fade-t', over && el.scrollTop > 1);
    el.classList.toggle('fade-b', over && el.scrollTop < el.scrollHeight - el.clientHeight - 1);
  }
  function refreshCardFades() {
    if (!cardsEl) return;
    cardsEl.querySelectorAll('.card-title').forEach(updateCardTitleFade);
    cardsEl.querySelectorAll('.card-excerpt').forEach(updateCardExcerptFade);
  }
  if (cardsEl) {
    cardsEl.querySelectorAll('.card-title').forEach(function (el) {
      updateCardTitleFade(el);
      el.addEventListener('scroll', function () { updateCardTitleFade(el); }, { passive: true });
    });
    cardsEl.querySelectorAll('.card-excerpt').forEach(function (el) {
      updateCardExcerptFade(el);
      el.addEventListener('scroll', function () { updateCardExcerptFade(el); }, { passive: true });
    });
    window.addEventListener('resize', refreshCardFades, { passive: true });
    window.addEventListener('load', refreshCardFades);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshCardFades);
  }
});

/* 阅读量异步填充：失败时保持隐藏，不显示假数据；不做本地存储 */
window.__siteDataReady.then(function hydrateViews() {
  var cfg = window.GOATCOUNTER;
  var els = document.querySelectorAll('[data-views]');
  if (!cfg || !cfg.code || !els.length) return;

  var base = 'https://' + cfg.code + '.goatcounter.com/counter/';
  var bust = '?v=' + Date.now();

  /* 总浏览量：排在文章数前面，取不到时连字符和数字一起隐藏 */
  function paintTotal(text) {
    var totalEl = document.getElementById('feed-total');
    var totalNum = document.getElementById('feed-total-num');
    var sepEl = document.getElementById('feed-sep');
    if (!totalEl || !totalNum || !sepEl) return;
    totalNum.textContent = text;
    totalEl.classList.remove('is-empty');
    sepEl.classList.remove('is-empty');
  }

  function paint(slug, text) {
    var nodes = document.querySelectorAll('[data-views]');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute('data-views') !== slug) continue;
      var num = nodes[i].querySelector('.views-num');
      if (num) num.textContent = text;
      nodes[i].classList.remove('is-empty');
    }
  }

  var seen = {};
  for (var i = 0; i < els.length; i++) {
    var slug = els[i].getAttribute('data-views');
    if (!slug || seen[slug]) continue;
    seen[slug] = true;
    fetchCount(slug);
  }

  function fetchCount(slug) {
    var url = base + encodeURIComponent(typeof cfg.pathPrefix === 'string' ? cfg.pathPrefix + slug : '/' + slug) + '.json' + bust;
    fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return '0';   // 该路径还没有记录，视为 0
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().then(function (d) { return d && d.count != null ? String(d.count) : null; });
    }).then(function (count) {
      if (count == null) return;
      paint(slug, count);
    }).catch(function () { /* 网络或配置问题：保持隐藏 */ });
  }

  /* TOTAL 是 GoatCounter 的特殊路径，返回整站总访问量 */
  function fetchTotal() {
    return fetch(base + 'TOTAL.json' + bust, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || d.count == null) return;
      paintTotal(String(d.count));
    }).catch(function () { /* 取不到就不占位 */ });
  }

  fetchTotal();
});

/* 计数由 trackPostView 直接发往 GoatCounter，不再加载第三方脚本 */

      let head = null;
      let langBtn = null;

      if (collapsible) {
        head = document.createElement('div');
        head.className = 'code-head';

        /* 图标只是视觉提示，点击顶栏都能切换；按钮本身保留键盘可达性 */
        let toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'code-toggle';
        toggle.innerHTML = CODE_TRIANGLE;

        var meta = document.createElement('span');
        meta.className = 'code-meta';

        var lines = document.createElement('span');
        lines.className = 'code-lines';
        lines.textContent = lineCount + ' Lines';

        var sep = document.createElement('span');
        sep.className = 'code-sep';
        sep.textContent = '-';

        langBtn = document.createElement('button');
        langBtn.type = 'button';
        langBtn.className = 'code-lang';
        langBtn.textContent = lang || 'Text';
        langBtn.title = '复制代码';
        langBtn.setAttribute('aria-label', '复制代码');

        meta.appendChild(lines);
        meta.appendChild(sep);
        meta.appendChild(langBtn);
        head.appendChild(toggle);
        head.appendChild(meta);
      }

      parent.insertBefore(block, pre);
      body.appendChild(pre);
      if (head) block.appendChild(head);
      block.appendChild(body);
      block.appendChild(check);

      let copyTimer = 0;
      let doCopy = function () {
        function done(ok) {
          if (!ok) return;
          block.classList.add('is-copied');
          clearTimeout(copyTimer);
          copyTimer = setTimeout(function () {
            block.classList.remove('is-copied');
          }, 2000);
        }
        if (window.copyText) { window.copyText(codeText, done); return; }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(codeText).then(function () { done(true); }, function () {});
        }
      };

      if (collapsible) {
        /* 收起时：点 Type 复制，点其它地方展开；展开后：点顶栏收起，点代码区复制 */
        block.addEventListener('click', function (e) {
          var t = e.target;
          if (t && t.closest && (t.closest('.code-lang') || t.closest('a'))) return;
          if (hasCodeSelection()) return;
          var collapsed = block.classList.contains('is-collapsed');
          var inHead = !!(t && t.closest && t.closest('.code-head'));
          if (collapsed || inHead) {
            setCodeCollapsed(block, !collapsed);
            if (window.refreshPostLayout) window.refreshPostLayout();
          } else {
            doCopy();
          }
        });

        langBtn.addEventListener('click', doCopy);
        setCodeCollapsed(block, flag === 'collapse' || (!flag && auto));
      } else {
        /* 普通代码块：点击即复制 */
        block.addEventListener('click', function (e) {
          if (e.target && e.target.closest && e.target.closest('a')) return;
          if (hasCodeSelection()) return;
          doCopy();
        });
      }
    }
  }

  window.decoratePostContent = function (root) {
    if (!root) return;
    wrapContentTables(root);
    applyAbbreviations(root);
    setupCodeBlocks(root);
  };
})();

(function () {
  let locks = 0;
  window.lockBackgroundScroll = function () {
    if (locks++ > 0) return;
    /* 只锁定滚动，不移动页面：关闭文章时首页位置保持原样，不再被拉回 */
    document.documentElement.style.overflow = 'hidden';
    /* body 不能用 hidden：hidden 会让 body 变成新的滚动容器，
       position:sticky 的标题栏改为相对 body 定位，页面滚动后会被顶出视口；
       clip 不创建滚动容器，既锁住背景滚动，又不破坏 sticky。 */
    document.body.style.overflow = 'clip';
  };
  window.unlockBackgroundScroll = function () {
    if (!locks || --locks > 0) return;
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  };
})();

(function () {
  const root = document.documentElement;
  const slider = document.getElementById('theme-slider');
  const knob = document.getElementById('theme-knob');
  const segs = Array.prototype.slice.call(slider.querySelectorAll('.theme-seg'));
  const OPTS = ['light', 'auto', 'dark'];
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  let pref = 'auto';
  try {
    const saved = localStorage.getItem('ae_theme');
    if (OPTS.indexOf(saved) !== -1) pref = saved;
  } catch (e) {}

  function apply() {
    root.dataset.theme = (pref === 'dark' || (pref === 'auto' && mq && mq.matches)) ? 'dark' : 'light';
    const idx = OPTS.indexOf(pref);
    knob.style.setProperty('--pos', idx);
    segs.forEach(function (s, i) {
      s.classList.toggle('is-active', i === idx);
      s.setAttribute('aria-checked', String(i === idx));
    });
  }
  apply();

  // 自适应模式下跟随系统变化
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () { if (pref === 'auto') apply(); });
  }

  segs.forEach(function (s) {
    s.addEventListener('click', function () {
      pref = s.dataset.themeOpt;
      try { localStorage.setItem('ae_theme', pref); } catch (e) {}
      apply();
    });
  });
})();

(function () {
  const btn = document.getElementById('menu-btn');
  const overlay = document.getElementById('menu-overlay');
  const box = document.getElementById('menu-box');
  let open = false;
  function set(v) {
    if (open === v) return;
    open = v;
    btn.classList.toggle('is-open', v);
    btn.setAttribute('aria-expanded', String(v));
    overlay.classList.toggle('is-open', v);
    overlay.setAttribute('aria-hidden', String(!v));
    if (v) window.lockBackgroundScroll();
    else window.unlockBackgroundScroll();
    if (v) {
      setTimeout(function () { if (open && !speedOpen) document.getElementById('menu-link-btn').focus(); }, 120);
    } else {
      btn.focus({ preventScroll: true });
    }
  }
  btn.addEventListener('click', function () { set(!open); });
  overlay.addEventListener('click', function (e) {
    if (!box.contains(e.target)) set(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) set(false); });

  /* ── 阅读速度（估算阅读时长用）── */
  const SPEED_KEY = 'ae_read_speed';
  const SPEED_DEFAULT = 300;
  const speedBtn = document.getElementById('btn-read-speed');
  const speedModal = document.getElementById('speed-modal');
  const speedInput = document.getElementById('speed-input');
  const speedReset = document.getElementById('speed-reset');
  let speedOpen = false;

  function clampSpeed(v) {
    if (String(v).trim() === '') return SPEED_DEFAULT;
    const n = Math.round(Number(v));
    if (!Number.isFinite(n)) return SPEED_DEFAULT;
    return Math.min(2000, Math.max(50, n));
  }
  function getReadSpeed() {
    try {
      const raw = localStorage.getItem(SPEED_KEY);
      if (raw == null) return SPEED_DEFAULT;
      const n = Number(raw);
      return Number.isFinite(n) && n >= 50 && n <= 2000 ? n : SPEED_DEFAULT;
    } catch (e) {
      return SPEED_DEFAULT;
    }
  }
  window.getReadSpeed = getReadSpeed;

  function openSpeed() {
    speedReset.classList.remove('is-active');
    speedInput.value = String(getReadSpeed());
    speedOpen = true;
    speedModal.classList.add('is-open');
    speedModal.setAttribute('aria-hidden', 'false');
    window.lockBackgroundScroll();
    setTimeout(function () {
      if (!speedOpen) return;
      speedInput.focus();
      speedInput.select();
    }, 80);
  }
  function closeSpeed() {
    if (!speedOpen) return;
    speedOpen = false;
    speedReset.classList.remove('is-active');
    speedModal.classList.remove('is-open');
    speedModal.setAttribute('aria-hidden', 'true');
    window.unlockBackgroundScroll();
    if (open) speedBtn.focus({ preventScroll: true });
    else document.getElementById('menu-btn').focus({ preventScroll: true });
  }
  function applySpeed(v) {
    try { localStorage.setItem(SPEED_KEY, String(v)); } catch (err) {}
    window.dispatchEvent(new CustomEvent('readspeedchange', { detail: v }));
  }
  function commitSpeed() {
    const raw = speedInput.value.trim();
    if (raw !== '') applySpeed(clampSpeed(raw));
    closeSpeed();
  }

  speedBtn.addEventListener('click', openSpeed);
  speedReset.addEventListener('click', function () {
    speedReset.blur();
    speedReset.classList.add('is-active');
    speedInput.value = String(SPEED_DEFAULT);
    applySpeed(SPEED_DEFAULT);
    speedInput.focus();
    speedInput.select();
  });
  speedInput.addEventListener('input', function () {
    speedReset.classList.remove('is-active');
  });
  speedModal.addEventListener('click', function (e) {
    if (e.target === speedModal) closeSpeed();
  });
  speedInput.addEventListener('keydown', function (e) {
    speedReset.classList.remove('is-active');
    if (e.key !== 'Enter') return;
    e.preventDefault();
    commitSpeed();
  });
  document.addEventListener('keydown', function (e) {
    if (!speedOpen || e.key !== 'Escape') return;
    e.preventDefault();
    e.stopPropagation();
    closeSpeed();
  }, true);
})();

window.__siteDataReady.then(function () {
  const btn       = document.getElementById('btn-site-search');
  const modal     = document.getElementById('search-modal');
  const box       = document.getElementById('sm-box');
  const input     = document.getElementById('sm-input');
  const tabsWrap  = document.getElementById('sm-tabs-wrap');
  const resultsEl = document.getElementById('sm-results');

  const POSTS = window.POSTS;
  const esc = window.escapeHTML;

  const MODES = ['title', 'date', 'tag'];
  const tabBtns = Array.prototype.slice.call(tabsWrap.querySelectorAll('.sm-tab-btn'));

  let isOpen = false;
  let modeIdx = 0;
  let dotMode = false;
  let dotTimer = null;
  let errorTimer = null;
  let tabsTransitionTimer = null;
  let searchScrollLocked = false;
  let lastQuery = '';

  function updateTabState(idx) {
    modeIdx = idx;
    tabBtns.forEach(function (b, i) {
      b.classList.toggle('is-active', i === idx);
      b.setAttribute('aria-selected', String(i === idx));
    });
  }

  function buildTabs() {
    tabsWrap.innerHTML = '';
    const tabsEl = document.createElement('div');
    tabsEl.className = 'sm-tabs';
    tabsEl.id = 'sm-tabs';
    const slider = document.createElement('div');
    slider.className = 'sm-tab-slider';
    slider.id = 'sm-tab-slider';
    tabsEl.appendChild(slider);

    tabsWrap.appendChild(tabsEl);
  }

  function updateSlider(idx, instant) {
    const slider = document.getElementById('sm-tab-slider');
    const tabs = document.getElementById('sm-tabs');
    const b = tabBtns[idx];
    if (!slider || !tabs || !b) return;
    const x = b.getBoundingClientRect().left - tabs.getBoundingClientRect().left - 4;
    const w = b.getBoundingClientRect().width;
    if (instant) {
      slider.style.transition = 'none';
      slider.style.width = w + 'px';
      slider.style.transform = 'translateX(' + x + 'px)';
      requestAnimationFrame(function () { slider.style.transition = ''; });
    } else {
      slider.style.width = w + 'px';
      slider.style.transform = 'translateX(' + x + 'px)';
    }
  }

  function setTab(idx) {
    updateTabState(idx);
    updateSlider(idx, false);
    if (dotMode) updateDotBars();
    if (lastQuery) runSearch(lastQuery);
  }

  tabBtns.forEach(function (b, i) {
    // 阻止 input 失焦（blur 会触发确认搜索）
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () {
      setTab(i);
      if (dotMode) expandTabs();
      resetDotTimer();
    });
  });

  /* ── 点条模式（收起为三段线） ── */
  function updateDotBars() {
    tabsWrap.querySelectorAll('.sm-dot-bar').forEach(function (b, i) {
      b.classList.toggle('is-active', i === modeIdx);
      b.setAttribute('aria-pressed', String(i === modeIdx));
    });
  }

  function expandTabs() {
    clearTimeout(tabsTransitionTimer);
    dotMode = false;
    buildTabs();
    const tabsEl = document.getElementById('sm-tabs');
    const fullH = tabsEl.scrollHeight + 8;
    requestAnimationFrame(function () {
      if (!isOpen || dotMode) return;
      tabsWrap.style.height = fullH + 'px';
      updateSlider(modeIdx, true);
      tabsTransitionTimer = setTimeout(function () { tabsWrap.style.height = ''; }, 380);
    });
  }

  function collapseToDots() {
    if (dotMode || !isOpen) return;
    clearTimeout(dotTimer);
    clearTimeout(tabsTransitionTimer);
    dotMode = true;
    tabsWrap.style.height = tabsWrap.scrollHeight + 'px';
    tabsWrap.getBoundingClientRect();
    requestAnimationFrame(function () {
      if (!dotMode || !isOpen) return;
      tabsWrap.style.height = '10px';
      tabsTransitionTimer = setTimeout(function () {
        if (!dotMode || !isOpen) return;
        tabsWrap.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'sm-dots-row';
        for (let i = 0; i < MODES.length; i++) {
          const bar = document.createElement('button');
          bar.type = 'button';
          bar.className = 'sm-dot-bar' + (i === modeIdx ? ' is-active' : '');
          bar.setAttribute('aria-label', '切换到' + ['标题', '日期', '标签'][i] + '搜索');
          bar.setAttribute('aria-pressed', String(i === modeIdx));
          bar.addEventListener('mousedown', function (e) { e.preventDefault(); });
          bar.addEventListener('click', function () {
            setTab(i);
            expandTabs();
            resetDotTimer();
          });
          row.appendChild(bar);
        }
        tabsWrap.appendChild(row);
        tabsWrap.style.height = '10px';
      }, 360);
    });
  }

  function resetDotTimer() {
    clearTimeout(dotTimer);
    if (!isOpen || !input.matches(':focus')) return;
    dotTimer = setTimeout(function () {
      if (isOpen && input.matches(':focus') && !dotMode) collapseToDots();
    }, 5000);
  }

  input.addEventListener('focus', function () {
    lastVH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if (dotMode) expandTabs();
    resetDotTimer();
  });
  input.addEventListener('blur', function () {
    clearTimeout(dotTimer);
    if (!isOpen) return;
    confirmSearch();
    collapseToDots();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== 'Escape') resetDotTimer();
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
  });
  // 输入时不搜索，仅清除错误态并重新计时
  input.addEventListener('input', function () {
    clearTimeout(errorTimer);
    box.classList.remove('is-error');

    resetDotTimer();
  });

  /* ── 软键盘：移动端收起键盘时同步移除焦点 ── */
  const mobileInputMQ = window.matchMedia('(hover: none), (pointer: coarse)');
  let lastVH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      const vh = window.visualViewport.height;
      if (mobileInputMQ.matches && vh > lastVH + 80 && input.matches(':focus')) input.blur();
      lastVH = vh;
    }, { passive: true });
  }

  /* ── 错误态：清空输入，placeholder 红字，3s 后恢复 ── */
  function showError(msg) {
    clearTimeout(errorTimer);
    const prev = input.value;
    box.classList.remove('is-error');
    void box.offsetWidth; // 重启动画
    box.classList.add('is-error');
    input.value = '';
    input.placeholder = msg;
    errorTimer = setTimeout(function () {

  function confirmSearch() {

      showError('未输入');
      lastQuery = '';
      renderResults([]);

    lastQuery = q;

  /* ── 匹配程度：完全匹配 > 前缀匹配 > 包含匹配 ── */
  function matchRank(value, ql) {
    var v = String(value || '').toLowerCase();
    if (!v) return -1;
    if (v === ql) return 0;
    if (v.indexOf(ql) === 0) return 1;
    return v.indexOf(ql) !== -1 ? 2 : -1;
  }

  function byDateDesc(a, b) {
    return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
  }

  function rankPost(c, mode, ql) {
    if (mode === 'title') return matchRank(window.postValue(c.title, 'Untitled'), ql);
    if (mode === 'date')  return matchRank(window.postValue(c.date, 'Date'), ql);
    var best = -1;

  }

  function runSearch(q) {
    const ql = q.toLowerCase();
    const mode = MODES[modeIdx];

    const list = POSTS.map(function (c) {
      return { post: c, rank: rankPost(c, mode, ql) };
    }).filter(function (x) {
      return x.rank !== -1;
    }).sort(function (a, b) {
      if (!!b.post.pin !== !!a.post.pin) return b.post.pin ? 1 : -1;
      if (a.rank !== b.rank) return a.rank - b.rank;

    lastQuery = '';
    input.value = '';
    input.placeholder = '';
    box.classList.remove('is-error');

      searchScrollLocked = true;
    }

      if (!isOpen) return;
      updateSlider(0, true);
      input.focus();

  }
  function close() {
    if (!isOpen) return;
    isOpen = false;
    input.blur();
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    btn.setAttribute('aria-expanded', 'false');

    clearTimeout(tabsTransitionTimer);

      searchScrollLocked = false;
    }
    btn.focus({ preventScroll: true });
  }

  modal.addEventListener('click', function (e) {
    if (e.target === modal) close(); // 仅遮罩本体：点条点击后会自毁重建，contains 判断会误判
  });

    if (e.key === 'Escape' && isOpen) close();
  });
});
